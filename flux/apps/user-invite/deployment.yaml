---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-invite
  namespace: identity
  labels:
    app: user-invite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-invite
  template:
    metadata:
      labels:
        app: user-invite
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: user-invite
          image: ghcr.io/yappingboy/becklab-user-invite:latest
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: LLDAP_URL
              value: "http://lldap.identity.svc.cluster.local:17170"
            - name: LLDAP_ADMIN_USER
              value: "admin"
            - name: LLDAP_ADMIN_PASS
              value: newpass123
            - name: SMTP_HOST
              value: "smtp-relay.identity.svc.cluster.local"
            - name: SMTP_PORT
              value: "25"
            - name: FROM_EMAIL
              value: "invites@becklab.cloud"
            - name: KEYCLOAK_URL
              value: "http://keycloak.identity.svc.cluster.local:8080"
            - name: KEYCLOAK_EXTERNAL_URL
              value: "https://keycloak.becklab.cloud"
            - name: KEYCLOAK_ADMIN_USER
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-password
                  key: admin-password
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: user-invite-secrets
                  key: flask-secret-key
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: user-invite
  namespace: identity
  labels:
    app: user-invite
spec:
  selector:
    app: user-invite
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP

---
# Ingress — behind admin oauth2-proxy middleware (requires /admins group)
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: user-invite
  namespace: apps
  labels:
    app: user-invite
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`user-invite.becklab.cloud`) && PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      priority: 10
      services:
        - name: user-invite
          port: 80
    - match: Host(`user-invite.becklab.cloud`)
      kind: Rule
      middlewares:
        - name: sso-admin-chain
          namespace: identity
      services:
        - name: user-invite
          port: 80
  tls:
    secretName: user-invite-tls
