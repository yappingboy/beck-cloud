apiVersion: batch/v1
kind: Job
metadata:
  name: build-emdr
  namespace: toolbox
  labels:
    app: emdr
    build-phase: "1"
  annotations:
    job-name: "build-emdr"
spec:
  parallelism: 1
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: emdr
        job-name: build-emdr
    spec:
      serviceAccountName: kaniko-builder
      initContainers:
        - name: copy-source
          image: alpine/git:latest
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          command:
            [
              "sh",
              "-c",
              "cd /workspace && git clone --branch main --depth 1 https://github.com/yappingboy/beck-cloud.git src && mkdir -p static && cp /workspace/src/flux/infrastructure/webapps/emdr/static/index.html static/ && cp /workspace/src/flux/infrastructure/webapps/emdr/static/three.module.js static/ && cp /workspace/src/flux/apps/toolbox/emdr-build/Dockerfile .",
            ]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.24.0
          args:
            - --dockerfile=/workspace/Dockerfile
            - --context=dir:///workspace
            - --destination=ghcr.io/yappingboy/emdr:latest
            - --cache=true
            - --cache-repo=ghcr.io/yappingboy/kaniko-cache
            - --skip-tls-verify
            - --push-retry=3
          resources:
            limits:
              cpu: "1"
              memory: 3Gi
            requests:
              cpu: 250m
              memory: 3Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: docker-config
              mountPath: /kaniko/.docker/config.json
              subPath: .dockerconfigjson
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: workspace
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: ghcr-config
