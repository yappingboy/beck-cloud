apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-dashboard
  namespace: toolbox
  labels:
    app: build-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: build-dashboard
  template:
    metadata:
      labels:
        app: build-dashboard
    spec:
      serviceAccountName: dashboard-builder
      containers:
        - name: server
          # Rebuilt with each source push; dashboard source lives in
          # tools/build-dashboard under the beck-cloud repo (see server.js comment).
          image: ghcr.io/yappingboy/build-dashboard:latest
          command: ["/usr/local/bin/node", "/app/server.js"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
