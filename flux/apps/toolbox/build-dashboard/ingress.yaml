apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: build-dashboard
  namespace: toolbox
spec:
  entryPoints:
    - web
    - websecure
  tls:
    secretName: build-dashboard-tls
  routes:
    - match: Host(`builds.becklab.cloud`)
      middlewares:
        - name: sso-admin-chain
          namespace: identity
      kind: Rule
      services:
        - name: build-dashboard
          namespace: toolbox
          port: 8080
