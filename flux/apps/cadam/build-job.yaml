# CADAM build job — clones upstream, applies the local fork overlay
# (Ollama provider + default model), builds the SPA, pushes to GHCR.
#
# Usage (one-shot, not part of Flux sync):
#   kubectl apply -f build-job.yaml -n toolbox
#   kubectl wait --for=condition=complete job/build-cadam -n toolbox --timeout=30m
#   # rebuild later:
#   kubectl delete job build-cadam -n toolbox
#   kubectl apply -f build-job.yaml -n toolbox
#
# Patches: the patched source files live in the repo at
#   flux/apps/cadam/patches/
# Build the cadam-patched-files Secret from them:
#   kubectl create secret generic cadam-patched-files -n toolbox \
#     --from-file=src-server-aiChat.ts=flux/apps/cadam/patches/src-server-aiChat.ts \
#     --from-file=src-lib-utils.ts=flux/apps/cadam/patches/src-lib-utils.ts \
#     --from-file=src-views-PromptView.tsx=flux/apps/cadam/patches/src-views-PromptView.tsx \
#     --from-file=src-views-EditorView.tsx=flux/apps/cadam/patches/src-views-EditorView.tsx \
#     --from-file=src-utils-meshPrintProcessUtils.ts=flux/apps/cadam/patches/src-utils-meshPrintProcessUtils.ts \
#     --from-file=package.json=flux/apps/cadam/patches/package.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: cadam-dockerfile
  namespace: toolbox
data:
  Dockerfile: |
    FROM node:22-slim AS build
    WORKDIR /app
    ENV HUSKY=0
    COPY . .
    RUN rm -f package-lock.json && npm install --ignore-scripts
    ARG VITE_SUPABASE_URL=https://supabase.becklab.cloud
    ARG VITE_SUPABASE_ANON_KEY=placeholder
    ARG ENVIRONMENT=local
    ARG OLLAMA_BASE_URL=http://172.16.0.7:11434
    ARG WEBHOOK_BASE_URL=https://cadam.becklab.cloud
    ENV CADAM_SELF_HOST=1 \
        VITE_SUPABASE_URL=$VITE_SUPABASE_URL \
        VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY \
        ENVIRONMENT=$ENVIRONMENT \
        OLLAMA_BASE_URL=$OLLAMA_BASE_URL \
        WEBHOOK_BASE_URL=$WEBHOOK_BASE_URL \
        SENTRY_DISABLE=true
    RUN npm run build
    # Sanity: SSR server bundle + SPA shell + client assets must all exist.
    # TanStack Start SPA mode emits the shell as .output/public/_shell.html.
    RUN test -f .output/server/index.mjs \
        && test -f .output/public/_shell.html \
        && ls .output/public/assets | head -3 \
        && echo "SSR build sanity check passed"
    FROM node:22-slim AS runtime
    WORKDIR /app
    ENV NODE_ENV=production \
        OLLAMA_BASE_URL=http://172.16.0.7:11434 \
        ENVIRONMENT=local \
        VITE_SUPABASE_URL=https://supabase.becklab.cloud \
        WEBHOOK_BASE_URL=https://cadam.becklab.cloud
    # Use the node image's built-in `node` user (uid/gid 1000) — matches the
    # deployment's runAsUser/runAsGroup: 1000 and avoids the Debian `addgroup
    # -S` flag-ambiguity that breaks the Alpine-style user creation.
    USER node:node
    COPY --from=build --chown=node:node /app/.output ./
    EXPOSE 3000
    HEALTHCHECK --interval=30s --timeout=5s --start-period=40s \
      CMD node -e "fetch('http://127.0.0.1:3000/cadam/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    CMD ["node", ".output/server/index.mjs"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-cadam
  namespace: toolbox
  labels:
    app.kubernetes.io/name: cadam
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: kaniko-builder
      initContainers:
        - name: clone-and-patch
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              set -e
              echo "Cloning CADAM from GitHub..."
              git clone --depth 1 https://github.com/Adam-CAD/CADAM.git /workspace
              git -C /workspace rev-parse HEAD > /workspace/.commit
              echo "Build source commit: $(cat /workspace/.commit)"
              echo "Applying local patches..."
              cp /patches/src-server-aiChat.ts     /workspace/src/server/aiChat.ts
              cp /patches/src-lib-utils.ts         /workspace/src/lib/utils.ts
              cp /patches/src-views-PromptView.tsx /workspace/src/views/PromptView.tsx
              cp /patches/src-views-EditorView.tsx /workspace/src/views/EditorView.tsx
              cp /patches/src-utils-meshPrintProcessUtils.ts /workspace/src/utils/meshPrintProcessUtils.ts
              cp /patches/package.json             /workspace/package.json
              cp /patches/vite.config.ts         /workspace/vite.config.ts
              cp /dockerfile/Dockerfile            /workspace/Dockerfile
              # Self-host mode: vite.config.ts carries the CADAM_SELF_HOST=1
              # nitro plugin; the Dockerfile stage assembles the node runtime
              echo "Patch applied OK (SSR build via CADAM_SELF_HOST=1)"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dockerfile
              mountPath: /dockerfile
              readOnly: true
            - name: patches
              mountPath: /patches
              readOnly: true
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.24.0
          envFrom:
            - secretRef:
                name: cadam-build-env
          args:
            - --dockerfile=Dockerfile
            - --build-arg=VITE_SUPABASE_ANON_KEY=$(SUPERBASE_ANON_KEY)
            - --context=dir:///workspace
            - --destination=ghcr.io/yappingboy/cadam:latest
            - --cache=true
            - --cache-repo=ghcr.io/yappingboy/kaniko-cache
            - --skip-tls-verify
            - --push-retry=3
          resources:
            limits:
              cpu: "4"
              memory: 12Gi
            requests:
              cpu: "2"
              memory: 6Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: docker-config
              mountPath: /kaniko/.docker/config.json
              subPath: .dockerconfigjson
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: workspace
          emptyDir: {}
        - name: dockerfile
          configMap:
            name: cadam-dockerfile
        - name: patches
          secret:
            secretName: cadam-patched-files
        - name: docker-config
          secret:
            secretName: ghcr-config
