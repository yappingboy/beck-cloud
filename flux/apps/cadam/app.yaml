# CADAM — text-to-CAD web app
# Source: https://github.com/Adam-CAD/CADAM (GPLv3)
# Forked and patched with Ollama provider support for local LLM inference.
# Serves the SPA at /cadam under cadam.becklab.cloud behind sso-admin-chain.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cadam
  namespace: cadam
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadam
  namespace: cadam
  labels:
    app.kubernetes.io/name: cadam
    app.kubernetes.io/part-of: cadam
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadam
        app.kubernetes.io/part-of: cadam
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cadam
          # Pinned by digest (2026-08-18, SPA build). After each rebuild via
          # build-job.yaml, bump this to the new image digest and let Flux roll.
          image: ghcr.io/yappingboy/cadam@sha256:8faa9ea738d84bf930c99f7fef053a1a0f411df7f8abe081cbf33e1cda089c0c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: OLLAMA_BASE_URL
              value: "http://172.16.0.7:11434"
            - name: ENVIRONMENT
              value: "local"
            - name: VITE_SUPABASE_URL
              value: "https://supabase.becklab.cloud"
            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: cadam-build-env
                  key: SUPERBASE_ANON_KEY
            - name: WEBHOOK_BASE_URL
              value: "https://cadam.becklab.cloud"
          envFrom:
            - secretRef:
                name: cadam-build-env
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /cadam/
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /cadam/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-credentials
      serviceAccountName: cadam
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: cadam
  namespace: cadam
  labels:
    app.kubernetes.io/name: cadam
spec:
  selector:
    app.kubernetes.io/name: cadam
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cadam
  namespace: cadam
  labels:
    app.kubernetes.io/name: cadam
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`cadam.becklab.cloud`)
      middlewares:
        - name: sso-admin-chain
          namespace: identity
      services:
        - name: cadam
          namespace: cadam
          port: 80
  tls:
    secretName: cadam-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cadam
  namespace: cadam
spec:
  secretName: cadam-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - cadam.becklab.cloud
