# CADAM — text-to-CAD web app
# Source: https://github.com/Adam-CAD/CADAM (GPLv3)
# Forked and patched with Ollama provider support for local LLM inference.
# Serves the SPA at /cadam under cadam.becklab.cloud behind sso-admin-chain.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cadam
  namespace: cadam
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadam
  namespace: cadam
  labels:
    app.kubernetes.io/name: cadam
    app.kubernetes.io/part-of: cadam
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadam
        app.kubernetes.io/part-of: cadam
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cadam
          image: ghcr.io/yappingboy/cadam:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: OLLAMA_BASE_URL
              value: "http://172.16.0.7:11434"
            - name: ENVIRONMENT
              value: "local"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-logs
              mountPath: /var/log/nginx
          livenessProbe:
            httpGet:
              path: /cadam/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /cadam/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-logs
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-credentials
      serviceAccountName: cadam
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: cadam
  namespace: cadam
  labels:
    app.kubernetes.io/name: cadam
spec:
  selector:
    app.kubernetes.io/name: cadam
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cadam
  namespace: cadam
  labels:
    app.kubernetes.io/name: cadam
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`cadam.becklab.cloud`)
      middlewares:
        - name: sso-admin-chain
          namespace: identity
      services:
        - name: cadam
          namespace: cadam
          port: 80
  tls:
    secretName: cadam-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cadam
  namespace: cadam
spec:
  secretName: cadam-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - cadam.becklab.cloud
