# Auto-split from cluster files
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-brand-theme
  namespace: monitoring
  labels:
    kustomize.toolkit.fluxcd.io/name: infrastructure
data:
  grafana-brand.css: "/* BeckCloud Brand Theme for Grafana\n * Dark mode-first. Ember\
    \ Gold #E8A838, Violet Haze #7C5CFC, Deep Space #0F1729\n */\n\nbody {\n  background-color:\
    \ #0F1729 !important;\n  color: #E2E8F0 !important;\n  font-family: 'Inter', system-ui,\
    \ -apple-system, sans-serif !important;\n}\n\n/* Top Navigation Bar */\n.grafana-toolbar,\n\
    [class*=\"navbar\"],\n[class*=\"header\"],\n[class*=\"app-toolbar\"] {\n  background-color:\
    \ #1E293B !important;\n  border-bottom: 1px solid #334155 !important;\n  box-shadow:\
    \ 0 2px 8px rgba(0, 0, 0, 0.3) !important;\n}\n\n[class*=\"navbar\"] [class*=\"\
    title\"],\n[class*=\"app-toolbar\"] [class*=\"title\"] {\n  color: #E8A838 !important;\n\
    \  font-family: 'JetBrains Mono', monospace !important;\n  font-weight: 700 !important;\n\
    \  letter-spacing: -0.5px !important;\n}\n\n/* Sidebar / Left Nav */\n[class*=\"\
    sidebar\"],\n[class*=\"left-nav\"],\n[class*=\"drawer\"] {\n  background-color:\
    \ #1E293B !important;\n  border-right: 1px solid #334155 !important;\n}\n\n[class*=\"\
    sidebar\"] [class*=\"item\"],\n[class*=\"left-nav\"] [class*=\"item\"],\n[class*=\"\
    drawer\"] [class*=\"item\"] {\n  color: #94A3B8 !important;\n  transition: background-color\
    \ 0.2s ease, color 0.2s ease !important;\n}\n\n[class*=\"sidebar\"] [class*=\"\
    item\"]:hover,\n[class*=\"left-nav\"] [class*=\"item\"]:hover,\n[class*=\"drawer\"\
    ] [class*=\"item\"]:hover {\n  background-color: #283548 !important;\n  color:\
    \ #E2E8F0 !important;\n}\n\n[class*=\"sidebar\"] [class*=\"item\"][class*=\"active\"\
    ],\n[class*=\"left-nav\"] [class*=\"item\"][class*=\"active\"],\n[class*=\"drawer\"\
    ] [class*=\"item\"][class*=\"active\"] {\n  color: #E8A838 !important;\n  border-left:\
    \ 3px solid #E8A838 !important;\n  background-color: rgba(232, 168, 56, 0.08)\
    \ !important;\n}\n\n/* Cards / Panels */\n[class*=\"panel\"],\n[class*=\"card\"\
    ],\n[class*=\"widget\"] {\n  background-color: #1E293B !important;\n  border:\
    \ 1px solid #334155 !important;\n  border-radius: 8px !important;\n  box-shadow:\
    \ 0 2px 8px rgba(0, 0, 0, 0.2) !important;\n}\n\n/* Buttons */\n[class*=\"btn\"\
    ],\nbutton[type=\"submit\"],\nbutton[type=\"button\"] {\n  background: linear-gradient(90deg,\
    \ #E8A838 0%, #FF6B4A 100%) !important;\n  color: #0F1729 !important;\n  border:\
    \ none !important;\n  border-radius: 6px !important;\n  font-weight: 600 !important;\n\
    \  font-family: 'Inter', sans-serif !important;\n  transition: transform 0.15s\
    \ ease, box-shadow 0.2s ease !important;\n}\n\n[class*=\"btn\"]:hover,\nbutton[type=\"\
    submit\"]:hover,\nbutton[type=\"button\"]:hover {\n  transform: translateY(-1px)\
    \ !important;\n  box-shadow: 0 4px 16px rgba(232, 168, 56, 0.3) !important;\n\
    }\n\n/* Primary Action Buttons */\n[class*=\"primary\"],\n[class*=\"action\"]\
    \ {\n  background: linear-gradient(90deg, #E8A838 0%, #FF6B4A 100%) !important;\n\
    \  color: #0F1729 !important;\n}\n\n/* Inputs */\ninput[type=\"text\"],\ninput[type=\"\
    search\"],\ninput[type=\"password\"],\n[class*=\"input\"],\n[class*=\"textfield\"\
    ] {\n  background-color: #0F1729 !important;\n  border: 1px solid #334155 !important;\n\
    \  color: #E2E8F0 !important;\n  border-radius: 6px !important;\n  transition:\
    \ border-color 0.2s ease, box-shadow 0.2s ease !important;\n}\n\ninput[type=\"\
    text\"]:focus,\ninput[type=\"search\"]:focus,\ninput[type=\"password\"]:focus,\n\
    [class*=\"input\"]:focus,\n[class*=\"textfield\"]:focus {\n  border-color: #E8A838\
    \ !important;\n  box-shadow: 0 0 0 2px rgba(232, 168, 56, 0.15) !important;\n\
    \  outline: none !important;\n}\n\n/* Status Colors */\n[class*=\"ok\"],\n[class*=\"\
    healthy\"],\n[class*=\"success\"] {\n  color: #4ADE80 !important;\n}\n\n[class*=\"\
    warning\"] {\n  color: #FBBF24 !important;\n}\n\n[class*=\"error\"],\n[class*=\"\
    critical\"],\n[class*=\"alert\"] {\n  color: #EF4444 !important;\n}\n\n/* Modal/Dialog\
    \ */\n[class*=\"modal\"],\n[class*=\"dialog\"],\n[class*=\"overlay\"] {\n  background-color:\
    \ #1E293B !important;\n  border: 1px solid #334155 !important;\n  border-radius:\
    \ 10px !important;\n  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;\n\
    }\n\n/* Scrollbar */\n::-webkit-scrollbar { width: 8px; height: 8px; }\n::-webkit-scrollbar-track\
    \ { background: #1E293B; }\n::-webkit-scrollbar-thumb { background: #334155; border-radius:\
    \ 4px; }\n::-webkit-scrollbar-thumb:hover { background: #475569; }\n\n/* Table\
    \ */\ntable, [class*=\"table\"] {\n  background-color: transparent !important;\n\
    \  color: #E2E8F0 !important;\n}\n\n[class*=\"table\"] th, [class*=\"table-header\"\
    ] {\n  color: #E8A838 !important;\n  font-family: 'JetBrains Mono', monospace\
    \ !important;\n  font-size: 0.75rem !important;\n  text-transform: uppercase !important;\n\
    \  letter-spacing: 0.06em !important;\n  border-bottom: 2px solid #334155 !important;\n\
    }\n\n[class*=\"table\"] tr:nth-child(even),\n[class*=\"table\"] tbody tr:nth-child(even)\
    \ {\n  background-color: rgba(30, 41, 59, 0.5) !important;\n}\n\n[class*=\"table\"\
    ] tr:hover,\n[class*=\"table\"] tbody tr:hover {\n  background-color: rgba(232,\
    \ 168, 56, 0.04) !important;\n}\n\n/* Legend/Labels */\n[class*=\"legend\"], [class*=\"\
    label\"] {\n  color: #94A3B8 !important;\n  font-size: 0.8125rem !important;\n\
    }\n\n/* Query Editor */\n[class*=\"query-editor\"], [class*=\"promql\"] {\n  background-color:\
    \ #0F1729 !important;\n  border: 1px solid #334155 !important;\n  color: #E2E8F0\
    \ !important;\n  font-family: 'JetBrains Mono', monospace !important;\n}\n\n/*\
    \ Time Picker */\n[class*=\"time-picker\"], [class*=\"relative-time\"] {\n  color:\
    \ #94A3B8 !important;\n}\n\n/* Alerts */\n[class*=\"alert-list\"] li {\n  border-left:\
    \ 3px solid #334155 !important;\n  padding-left: 0.75rem !important;\n  margin-bottom:\
    \ 0.5rem !important;\n}\n[class*=\"alert-list\"] li[class*=\"alerting\"] {\n \
    \ border-left-color: #EF4444 !important;\n  background-color: rgba(239, 68, 68,\
    \ 0.05) !important;\n}\n[class*=\"alert-list\"] li[class*=\"pending\"] {\n  border-left-color:\
    \ #FBBF24 !important;\n  background-color: rgba(251, 191, 36, 0.05) !important;\n\
    }\n\n/* Dashboard Row */\n[class*=\"dashboard-row\"] {\n  border-bottom: 1px solid\
    \ #283548 !important;\n}\n\n/* Tooltip */\n[class*=\"tooltip\"] {\n  background-color:\
    \ #1E293B !important;\n  border: 1px solid #334155 !important;\n  color: #E2E8F0\
    \ !important;\n  border-radius: 6px !important;\n  font-size: 0.8125rem !important;\n\
    }\n\n/* Toast/Notification */\n[class*=\"toast\"], [class*=\"notification\"] {\n\
    \  background-color: #1E293B !important;\n  border: 1px solid #334155 !important;\n\
    \  border-radius: 8px !important;\n  color: #E2E8F0 !important;\n  box-shadow:\
    \ 0 4px 16px rgba(0, 0, 0, 0.4) !important;\n}\n\n/* Selects */\nselect, [class*=\"\
    select\"] {\n  background-color: #0F1729 !important;\n  border: 1px solid #334155\
    \ !important;\n  color: #E2E8F0 !important;\n  border-radius: 6px !important;\n\
    }\nselect option {\n  background-color: #1E293B !important;\n  color: #E2E8F0\
    \ !important;\n}\n\n/* Tabs */\n[class*=\"tabs\"] [class*=\"tab\"][class*=\"active\"\
    ] {\n  color: #E8A838 !important;\n  border-bottom: 2px solid #E8A838 !important;\n\
    }\n[class*=\"tabs\"] [class*=\"tab\"] {\n  color: #94A3B8 !important;\n  transition:\
    \ color 0.2s ease !important;\n}\n[class*=\"tabs\"] [class*=\"tab\"]:hover {\n\
    \  color: #E2E8F0 !important;\n}\n\n/* Loading */\n[class*=\"spinner\"], [class*=\"\
    loading\"] {\n  color: #E8A838 !important;\n}\n\n/* Panel Title */\n[class*=\"\
    panel-title\"], [class*=\"panel-header\"] {\n  color: #E2E8F0 !important;\n  font-family:\
    \ 'JetBrains Mono', monospace !important;\n  font-weight: 600 !important;\n}\n\
    \n/* Config Header */\n[class*=\"config-header\"] {\n  color: #E8A838 !important;\n\
    \  font-family: 'JetBrains Mono', monospace !important;\n}\n"
