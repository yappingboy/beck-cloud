# Auto-split from cluster files
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`grafana.becklab.cloud`)
    kind: Rule
    middlewares:
    - name: grafana-role-chain
      namespace: identity
    services:
    - name: kube-prometheus-stack-grafana
      port: 80
  tls:
    secretName: grafana-tls
