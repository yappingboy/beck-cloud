apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: identity
spec:
  interval: 1m
  install:
    timeout: 60s
  upgrade:
    timeout: 60s
  chart:
    spec:
      chart: oauth2-proxy
      version: 7.6.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: flux-system
  values:
    # Workaround: existingSecret collides with chart-generated env vars in v7.6.0.
    # Use extraEnv with secretKeyRef to inject secrets instead.
    config:
      existingSecret: oauth2-proxy-secrets
      configFile: |
        provider = "keycloak-oidc"
        provider_display_name = "Keycloak"
        oidc_issuer_url = "https://keycloak.becklab.cloud/realms/homelab"
        oidc_groups_claim = "groups"
        scope = "openid email profile"
        email_domains = ["*"]
        allowed_groups = ["/admins", "/auditors", "/service", "/dev", "/download", "/cms", "/monitor", "/security", "/gaming", "/3dp", "/infrastructure"]
        redirect_url = "https://oauth2.becklab.cloud/oauth2/callback"
        cookie_name = "_oauth2_admin"
        cookie_secure = true
        cookie_httponly = true
        cookie_samesite = "lax"
        cookie_domains = [".becklab.cloud"]
        whitelist_domains = [".becklab.cloud"]
        skip_provider_button = true
        reverse_proxy = true
        upstreams = ["static://202"]
        session_store_type = "redis"
    redis:
      host: "redis.identity.svc.cluster.local"
      password: "n2GhqVLqsP44FbrZRtKIY8JOYyiHuZkVrLI37dJR0TI="
    extraArgs:
      - --set-xauthrequest=true
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - oauth2.becklab.cloud
      paths:
        - /oauth2/
      pathType: Prefix
      tls:
        - hosts:
            - oauth2.becklab.cloud
          secretName: oauth2-proxy-tls
