apiVersion: apps/v1
kind: Deployment
metadata:
  name: role-enforcer
  namespace: identity
  labels:
    app: role-enforcer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: role-enforcer
  template:
    metadata:
      labels:
        app: role-enforcer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: role-enforcer
      containers:
      - name: role-enforcer
        image: quay.io/beckcloud/role-enforcer:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        env:
        - name: POLICY_PATH
          value: /etc/role-enforcer/policy.yaml
        - name: JWKS_URL
          value: https://keycloak.becklab.cloud/realms/homelab/protocol/openid-connect/certs
        - name: REALM
          value: homelab
        - name: CLIENT_ID
          value: beckcloud-services
        - name: LOG_LEVEL
          value: info
        - name: PORT
          value: '8080'
        volumeMounts:
        - name: policy
          mountPath: /etc/role-enforcer/policy.yaml
          subPath: policy.yaml
          readOnly: true
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: policy
        configMap:
          name: role-enforcer-policy