apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    app: role-enforcer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: role-enforcer
  namespace: identity
  labels:
    app: role-enforcer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: role-enforcer-policy
  namespace: identity
  labels:
    app: role-enforcer
data:
  policy.yaml: '# BeckCloud Role Enforcement Policy

    # Format: service_name: allowed_roles (comma-separated)

    # Roles must be present in JWT resource_access.beckcloud-services.roles

    #

    # Services requiring ADMIN role only:

    keycloak-admin: admin

    traefik-admin: admin

    affine-admin: admin

    one-admin: admin

    silex-admin: admin

    #

    # Services requiring MONITOR role:

    prometheus: monitor

    grafana: monitor

    hubble: monitor

    alertmanager: monitor

    #

    # Services requiring DOWNLOAD or MEDIA_VIEW role (OR logic):

    qbittorrent: download,media-view

    #

    # Services requiring DOWNLOAD role:

    sabnzbd: download

    nzbget: download

    #

    # Services requiring MEDIA_VIEW role:

    radarr: media-view

    sonarr: media-view

    prowlarr: media-view

    bazarr: media-view

    jellyfin: media-view

    swiparr: media-view

    homebox: media-view

    #

    # Services requiring MEDIA-MANAGE role:

    tdarr: media-manage

    jellyseerr: media-manage

    #

    # Services requiring DEV role:

    auth-service: dev

    beckflow: dev

    cron-jobs: dev

    dns-monitor: dev

    image-editor-api: dev

    #

    # Services requiring CMS role:

    directus: cms

    manyfold: cms

    #

    # Services requiring USER role (authenticated):

    homepage: user

    #

    # Services requiring CMS or USER role (OR logic):

    affine: cms,user

    '
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: role-enforcer
  namespace: identity
  labels:
    app: role-enforcer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: role-enforcer
  template:
    metadata:
      labels:
        app: role-enforcer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: role-enforcer
      containers:
      - name: role-enforcer
        image: quay.io/beckcloud/role-enforcer:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        env:
        - name: POLICY_PATH
          value: /etc/role-enforcer/policy.yaml
        - name: JWKS_URL
          value: https://keycloak.becklab.cloud/realms/homelab/protocol/openid-connect/certs
        - name: REALM
          value: homelab
        - name: CLIENT_ID
          value: beckcloud-services
        - name: LOG_LEVEL
          value: info
        - name: PORT
          value: '8080'
        volumeMounts:
        - name: policy
          mountPath: /etc/role-enforcer/policy.yaml
          subPath: policy.yaml
          readOnly: true
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: policy
        configMap:
          name: role-enforcer-policy
---
apiVersion: v1
kind: Service
metadata:
  name: role-enforcer
  namespace: identity
  labels:
    app: role-enforcer
spec:
  selector:
    app: role-enforcer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
