---
# SSO middleware chains for new RBAC groups
# Pattern: oauth2-redirect-{group} → keycloak-forwardauth-admin → {group}-role-check
# Each chain uses a unique cookie to avoid conflicts with _oauth2_admin / _oauth2_media

# ===== AUDITORS =====
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-redirect-auditors
  namespace: identity
spec:
  errors:
    status:
      - "401"
    query: "/oauth2/callback?groups=auditors&state={url}"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auditors-role-check
  namespace: identity
spec:
  headers:
    customResponseHeaders:
      X-Forwarded-User: "{authRequestUser}"
      X-Forwarded-Groups: "auditors"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso-auditors-chain
  namespace: identity
spec:
  chain:
    middlewares:
      - name: oauth2-redirect-auditors
        namespace: identity
      - name: keycloak-forwardauth-admin
        namespace: identity
      - name: auditors-role-check
        namespace: identity

