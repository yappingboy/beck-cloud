# ── Composite Chains ────────────────────────────────────────────
# Chains that combine oauth2-proxy auth + role checking

# Grafana: SSO media + monitor role
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-role-chain
  namespace: identity
spec:
  chain:
    middlewares:
      - name: oauth2-redirect-media
        namespace: identity
      - name: keycloak-forwardauth-media
        namespace: identity
      - name: monitor-role-check
        namespace: identity

