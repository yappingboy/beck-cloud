# ── Role-Enforced SSO Middleware Chains ──────────────────────────
# New Traefik middleware definitions that enforce per-service RBAC.
# Each service gets a role-check middleware that validates JWT roles
# before allowing access. Falls back to the existing sso-admin-chain
# and sso-media-chain for services without role requirements.
#
# Usage in ingress routes:
#   annotations:
#     traefik.ingress.kubernetes.io/router.middlewares: identity,qwen-<service>-role@kubernetescrd
# ─────────────────────────────────────────────────────────────────

# ── Admin Role Checker ──────────────────────────────────────────
# Requires the user to have the 'admin' role in the JWT
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-role-check
  namespace: identity
spec:
  plugin:
    role-enforcer:
      service: "admin"
      roles: "admin"
      required: true
      jwksUrl: "https://keycloak.becklab.cloud/realms/homelab/protocol/openid-connect/certs"
      realm: "homelab"
      clientId: "beckcloud-services"
      failStatus: 403

