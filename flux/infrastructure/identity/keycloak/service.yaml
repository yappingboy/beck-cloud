apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
spec:
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgresql
  namespace: identity
spec:
  selector:
    app: keycloak-postgresql
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  clusterIP: None