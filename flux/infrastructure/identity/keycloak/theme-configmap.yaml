  login_resources_css_beckcloud.css: |-
    /* BeckCloud brand overlay for the stock keycloak.v2 login UI.
       CSS-only by design; brand tokens from docs/brand/COLORS.md. */

    :root {
      --bc-ember: #e8a838;
      --bc-ember-dark: #b87f1e;
      --bc-gunmetal: #0f1729;

      /* PatternFly v5 brand tokens -> Ember Gold */
      --pf-t--global--color--brand--default: var(--bc-ember);
      --pf-t--global--color--brand--hover: var(--bc-ember-dark);
      --pf-t--global--color--brand--clicked: var(--bc-ember-dark);
      --pf-t--global--color--brand--disabled: #e6cfa3;
    }

    /* Hero backdrop: gunmetal wash instead of Keycloak blue fog */
    body#keycloak-bg,
    .pf-v5-c-login {
      background-color: var(--bc-gunmetal);
      background-image:
        radial-gradient(1100px 520px at 75% -10%, rgba(232, 168, 56, 0.14), transparent 60%),
        radial-gradient(900px 500px at 15% 110%, rgba(124, 92, 252, 0.10), transparent 60%);
      background-attachment: fixed;
    }

    /* Replace the "Sign in to X" text with the BeckCloud lockup */
    #kc-header-wrapper.pf-v5-c-brand {
      height: 96px;
      min-width: 220px;
      background: url('../images/beckcloud-logo.svg') left center / contain no-repeat;
      text-indent: 110%;
      white-space: nowrap;
      overflow: hidden;
    }

    /* Gold links; stock contrast kept everywhere else */
    .pf-v5-c-login a { color: var(--bc-ember-dark); }
    .pf-v5-c-login a:hover { color: var(--bc-ember); }
  login_resources_images_beckcloud-logo.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
      <!-- Hexagon Mark -->
      <g transform="translate(4, 0)">
        <!-- Hexagon outline -->
        <path d="M28,2 C44,2 60,12 60,28 C60,44 44,54 28,54 C12,54 0,44 0,28 C0,12 12,2 28,2Z"
              stroke="#E8A838" stroke-width="2.5" fill="none"/>
        <!-- Ember core (organic flame shape) -->
        <path d="M28,12 C34,18 40,28 38,36 C36,44 32,50 28,50 C24,50 20,44 18,36 C16,28 22,18 28,12Z"
              fill="#E8A838" opacity="0.9"/>
      </g>
      <!-- Wordmark -->
      <text x="76" y="34" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="26" letter-spacing="-0.5">
        <tspan fill="#E8A838">Beck</tspan>
        <tspan fill="url(#cloud-grad)">Cloud</tspan>
      </text>
      <defs>
        <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#E8A838"/>
          <stop offset="100%" stop-color="#FF6B4A"/>
        </linearGradient>
      </defs>
    </svg>
  login_theme.properties: |-
    # BeckCloud brand theme for Keycloak 26 login.
    # CSS-ONLY overlay on the stock keycloak.v2 UI: zero .ftl overrides on purpose.
    # Every auth flow renders Keycloak's own templates. Read
    # docs/research/theming-audit.md BEFORE adding any .ftl file to this theme.
    parent=keycloak.v2
    import=common/keycloak
    styles=css/styles.css css/beckcloud.css
