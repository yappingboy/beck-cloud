# ── BeckCloud RBAC — Keycloak Role Definitions ──────────────────
# These roles are created in Keycloak's homelab realm.
# 
# This file documents the role structure for:
# 1. Terraform Keycloak provider (if used)
# 2. Manual Keycloak Admin Console configuration
# 3. Automated role provisioning scripts
#
# ─────────────────────────────────────────────────────────────────
#
# REALM ROLES (Keycloak "Realm Roles" section):
#
# 1. beckcloud.admin
#    - Description: Full admin access to all BeckCloud services
#    - Composite roles: monitor, dev, cms, download, media-view, media-manage, user
#    - Default group: /admins (LLDAP sync)
#    - K8s mapping: keycloak:/admins → cluster-admin
#
# 2. beckcloud.user
#    - Description: Standard member access (authenticated users)
#    - Composite roles: media-view, user
#    - Default group: /media (LLDAP sync)
#    - Purpose: Any authenticated user gets basic media access
#
# 3. beckcloud.service
#    - Description: Service-to-service machine accounts
#    - No composite roles (roles assigned per-client)
#    - Purpose: Internal service accounts (e.g., user-invite → Keycloak API)
#
# 4. beckcloud.auditor
#    - Description: Read-only access to audit logs and dashboards
#    - Composite roles: monitor, user
#    - Purpose: Audit log viewer, monitoring dashboards
#
# ─────────────────────────────────────────────────────────────────
#
# CLIENT ROLES (Keycloak "beckcloud-services" client):
#
# The beckcloud-services client is an OIDC client that:
# - Access Type: confidential
# - Standard Flow: enabled
# - Direct Access: enabled
# - Service Accounts: enabled (for machine accounts)
# - Full Payload: enabled (includes client roles in JWT)
#
# Client roles defined under this client:
#
# Service Category Roles:
#   admin        — Full admin (all services)
#   monitor      — Monitoring (Grafana, Prometheus, Alertmanager, Hubble)
#   download     — Download managers (qBittorrent, SABnzbd, nzbget)
#   media-view   — Media browsing (Jellyfin, Radarr, Sonarr, etc.)
#   media-manage — Media management (Tdarr, Jellyseerr)
#   dev          — Development tools (Auth Service, BeckFlow, Cron, DNS Monitor, Image Editor)
#   cms          — Content management (Directus, Manyfold, Affine)
#   user         — General authenticated access (Homepage, OAuth2 BeckLab)
#
# ─────────────────────────────────────────────────────────────────
#
# GROUP-TO-ROLE MAPPING (managed by LLDAP sync):
#
# /admins (LLDAP) → beckcloud.admin realm role + all client roles
# /media (LLDAP)  → beckcloud.user realm role + media-view client role
# /downloads (LLDAP) → download client role
# /monitoring (LLDAP) → monitor client role
# /dev (LLDAP) → dev client role
# /cms (LLDAP) → cms client role
# /security (LLDAP) → security client role
#
# ─────────────────────────────────────────────────────────────────
#
# JWT CLAIM STRUCTURE (after implementation):
#
# {
#   "sub": "uuid",
#   "preferred_username": "yappingboy",
#   "email": "yappingboy@gmail.com",
#   "groups": ["/admins", "/media"],
#   "realm_access": {
#     "roles": ["beckcloud.admin", "default-roles-homelab", "offline_access", "uma_authorization"]
#   },
#   "resource_access": {
#     "beckcloud-services": {
#       "roles": ["admin", "monitor", "download", "media-view", "media-manage", "dev", "cms", "user"]
#     },
#     "realm-management": {
#       "roles": ["realm-admin", "view-users", "manage-users", ...]
#     }
#   }
# }
#
# ─────────────────────────────────────────────────────────────────
#
# KUBERNETES RBAC MAPPING (update cluster-roles.yaml):
#
# Currently: keycloak:/admins → cluster-admin
# 
# New (future):
# - keycloak:/admins → cluster-admin (keep existing)
# - role-enforcer service reads JWT roles from Traefik headers
#   (no direct K8s RBAC needed for service-level access)
#
# ─────────────────────────────────────────────────────────────────
#
# IMPLEMENTATION STEPS:
#
# 1. Create the beckcloud-services OIDC client in Keycloak
#    - clientId: beckcloud-services
#    - secret: generate and store in secret
#    - Access Type: confidential
#    - Standard Flow: ON
#    - Direct Access: ON
#    - Service Accounts: ON
#    - Full Payload: ON
#
# 2. Define client roles under beckcloud-services:
#    admin, monitor, download, media-view, media-manage, dev, cms, user
#
# 3. Assign roles to users:
#    - All /admins members get all client roles
#    - All /media members get media-view
#    - Specific users get additional roles
#
# 4. Configure oauth2-proxy to include beckcloud-services roles in headers
#    - Add --claim-scopes=roles to extraArgs
#    - Or configure Keycloak to include clientRoles in token
#
# 5. Deploy role-enforcer service
#
# 6. Update ingress routes with role-enforced middleware chains
#
# ─────────────────────────────────────────────────────────────────

# ── OAuth2 Client Secret for beckcloud-services ─────────────────
# Generate with: openssl rand -hex 32
# Store in: identity/oauth2-proxy-beckcloud-services secret
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-beckcloud-services
  namespace: identity
  labels:
    app: role-enforcer
type: Opaque
stringData:
  client-id: "beckcloud-services"
  client-secret: "<generate-with-openssl-rand-hex-32>"
  jwks-url: "https://keycloak.becklab.cloud/realms/homelab/protocol/openid-connect/certs"
  realm: "homelab"
  client-id-claim: "beckcloud-services"
