apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logout-page
  namespace: identity
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - logout.becklab.cloud
    secretName: logout-tls
  rules:
  - host: logout.becklab.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: logout-page
            port:
              number: 80
      - path: /logout
        pathType: Prefix
        backend:
          service:
            name: logout-page
            port:
              number: 80