# ── BeckCloud RBAC Audit Sync CronJob ───────────────────────────
# Periodically polls Keycloak admin events and syncs permission
# changes to Directus for audit trail and admin panel display.
#
# Runs every 5 minutes. Stores last sync cursor in a ConfigMap
# to avoid reprocessing events.
# ─────────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-sync-config
  namespace: identity
  labels:
    app: audit-sync
data:
  config.json: |
    {
      "keycloakAdminUrl": "https://keycloak.becklab.cloud/admin",
      "keycloakRealm": "homelab",
      "directusUrl": "https://cms.becklab.cloud",
      "directusCollection": "rbac_audit_log",
      "syncIntervalMinutes": 5
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: audit-sync-secrets
  namespace: identity
  labels:
    app: audit-sync
type: Opaque
stringData:
  KEYCLOAK_ADMIN_PASSWORD: "<from secret-keycloak.yaml>"
  KEYCLOAK_SERVICE_CLIENT_SECRET: "<generate: openssl rand -hex 32>"
  DIRECTUS_TOKEN: "<admin token or service account token>"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-sync
  namespace: identity
  labels:
    app: audit-sync
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: audit-sync
          restartPolicy: OnFailure
          containers:
            - name: audit-sync
              image: alpine:3.19
              command:
                - /bin/sh
                - -c
                - |
                  #!/bin/sh
                  set -e
                  
                  CONFIG=$(cat /etc/audit-sync/config.json)
                  KC_URL=$(echo "$CONFIG" | jq -r '.keycloakAdminUrl')
                  KC_REALM=$(echo "$CONFIG" | jq -r '.keycloakRealm')
                  DC_URL=$(echo "$CONFIG" | jq -r '.directusUrl')
                  DC_COLLECTION=$(echo "$CONFIG" | jq -r '.directusCollection')
                  
                  # Get admin token
                  KC_TOKEN=$(curl -s -X POST "${KC_URL}/realms/master/protocol/openid-connect/token" \
                    -d "client_id=kc-admin-cli" \
                    -d "username=admin" \
                    -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                    -d "grant_type=password" | jq -r '.access_token')
                  
                  # Get last cursor
                  LAST_CURSOR=0
                  if [ -f /tmp/last-cursor ]; then
                    LAST_CURSOR=$(cat /tmp/last-cursor)
                  fi
                  
                  # Fetch events since last cursor
                  EVENTS=$(curl -s "${KC_URL}/admin/realms/${KC_REALM}/admin-events?from=${LAST_CURSOR}" \
                    -H "Authorization: Bearer ${KC_TOKEN}" | jq '.')
                  
                  COUNT=$(echo "$EVENTS" | jq 'length')
                  echo "Fetched ${COUNT} events since cursor ${LAST_CURSOR}"
                  
                  if [ "$COUNT" -eq 0 ]; then
                    echo "No new events"
                    exit 0
                  fi
                  
                  # Get max event ID for cursor advancement
                  MAX_ID=$(echo "$EVENTS" | jq '[.[].eventId] | max')
                  echo "$MAX_ID" > /tmp/last-cursor
                  
                  # Process each event
                  echo "$EVENTS" | jq -c '.[]' | while read -r event; do
                    EVENT_TYPE=$(echo "$event" | jq -r '.eventType')
                    TIMESTAMP=$(echo "$event" | jq -r '.time')
                    USER_ID=$(echo "$event" | jq -r '.userId // empty')
                    IP_ADDRESS=$(echo "$event" | jq -r '.ipAddress // "unknown"')
                    DETAILS=$(echo "$event" | jq -c '.details // {}')
                    
                    # Map Keycloak event types to our audit categories
                    case "$EVENT_TYPE" in
                      GRANT_CLIENT_ROLE)
                        ROLE=$(echo "$DETAILS" | jq -r '.clientId // "unknown"')
                        ACTION="role_assigned"
                        ;;
                      REMOVE_CLIENT_ROLE)
                        ROLE=$(echo "$DETAILS" | jq -r '.clientId // "unknown"')
                        ACTION="role_revoked"
                        ;;
                      UPDATE_ROLE_MAPPING)
                        ROLE=$(echo "$DETAILS" | jq -r '.roleMappingClientId // "unknown"')
                        ACTION="role_mapping_changed"
                        ;;
                      LOGIN)
                        ACTION="login"
                        ROLE=""
                        ;;
                      TOKEN_EXCHANGE)
                        ACTION="token_exchanged"
                        ROLE=""
                        ;;
                      *)
                        ACTION="event_${EVENT_TYPE}"
                        ROLE=""
                        ;;
                    esac
                    
                    # Write to Directus audit collection
                    curl -s -X POST "${DC_URL}/api/items/${DC_COLLECTION}" \
                      -H "Authorization: Bearer ${DIRECTUS_TOKEN}" \
                      -H "Content-Type: application/json" \
                      -d "{
                        \"event_type\": \"${EVENT_TYPE}\",
                        \"action\": \"${ACTION}\",
                        \"user_id\": \"${USER_ID}\",
                        \"ip_address\": \"${IP_ADDRESS}\",
                        \"role\": \"${ROLE}\",
                        \"details\": $(echo "$DETAILS" | jq -c '.'),
                        \"keycloak_timestamp\": ${TIMESTAMP},
                        \"synced_at\": $(date +%s)
                      }" > /dev/null 2>&1
                  done
                  
                  echo "Synced ${COUNT} events"
              env:
                - name: KEYCLOAK_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: secret-keycloak
                      key: KEYCLOAK_ADMIN_PASSWORD
                - name: DIRECTUS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: audit-sync-secrets
                      key: DIRECTUS_TOKEN
              volumeMounts:
                - name: config
                  mountPath: /etc/audit-sync
                  readOnly: true
                - name: cursor
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: audit-sync-config
            - name: cursor
              emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-sync
  namespace: identity
  labels:
    app: audit-sync
