apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix-relay
  namespace: identity
  labels:
    app: postfix-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postfix-relay
  template:
    metadata:
      labels:
        app: postfix-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: hash-sasl
        image: mwader/postfix-relay:1.11.0
        command:
        - sh
        - -c
        - 'cp /tmp/sasl_passwd /etc/postfix/sasl_passwd

          postmap hash:/etc/postfix/sasl_passwd

          cp /etc/postfix/sasl_passwd.db /tmp/sasl_passwd.db

          '
        volumeMounts:
        - name: sasl
          mountPath: /tmp/sasl_passwd
          subPath: sasl_passwd
          readOnly: true
        - name: sasl-db
          mountPath: /tmp
        securityContext:
          capabilities:
            drop:
            - ALL
      containers:
      - name: postfix
        image: mwader/postfix-relay:1.11.0
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        ports:
        - containerPort: 25
          name: smtp
          protocol: TCP
        - containerPort: 587
          name: smtp-tls
          protocol: TCP
        env:
        - name: TZ
          value: America/New_York
        volumeMounts:
        - name: config
          mountPath: /etc/postfix/main.cf
          subPath: main.cf
          readOnly: true
        - name: sasl
          mountPath: /etc/postfix/sasl_passwd
          subPath: sasl_passwd
          readOnly: true
        - name: sasl-db
          mountPath: /etc/postfix/sasl_passwd.db
          subPath: sasl_passwd.db
          readOnly: true
        - name: tls-cert
          mountPath: /etc/ssl/certs/mail.crt
          subPath: tls.crt
          readOnly: true
        - name: tls-key
          mountPath: /etc/ssl/private/mail.key
          subPath: tls.key
          readOnly: true
        - name: mail-queue
          mountPath: /var/spool/postfix
        - name: mail-logs
          mountPath: /var/log/postfix
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: postfix-main
          items:
          - key: main.cf
            path: main.cf
          defaultMode: 420
      - name: sasl
        secret:
          secretName: mailgun-smtp
          items:
          - key: sasl_passwd
            path: sasl_passwd
          defaultMode: 416
      - name: sasl-db
        emptyDir: {}
      - name: tls-cert
        secret:
          secretName: mail-tls
          items:
          - key: tls.crt
            path: tls.crt
          defaultMode: 420
      - name: tls-key
        secret:
          secretName: mail-tls
          items:
          - key: tls.key
            path: tls.key
          defaultMode: 384
      - name: mail-queue
        emptyDir: {}
      - name: mail-logs
        emptyDir: {}