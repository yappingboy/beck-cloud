apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lldap
  namespace: identity
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - lldap.becklab.cloud
    secretName: lldap-tls
  rules:
  - host: lldap.becklab.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lldap
            port:
              number: 17170