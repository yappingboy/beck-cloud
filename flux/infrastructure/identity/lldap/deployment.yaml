apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: identity
  labels:
    app: lldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lldap
  template:
    metadata:
      labels:
        app: lldap
    spec:
#      securityContext:
#        runAsNonRoot: true
#        runAsUser: 1000
#        fsGroup: 1000
# This container must start with root access, afterwords it downgrades itself.
      containers:
      - name: lldap
        image: lldap/lldap:latest-debian-rootless
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        env:
        - name: LLDAP_LDAP_BASE_DN
          value: dc=becklab,dc=cloud
        - name: LLDAP_LDAP_USER_DN
          value: admin
        - name: LLDAP_LDAP_USER_PASS
          valueFrom:
            secretKeyRef:
              name: lldap-admin-password
              key: admin-password
        - name: LLDAP_KEY_SEED
          valueFrom:
            secretKeyRef:
              name: lldap-admin-password
              key: key-seed
        - name: LLDAP_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: lldap-admin-password
              key: jwt-secret
        - name: LLDAP_DATABASE_URL
          value: sqlite:///data/users.db?mode=rwc
        - name: LLDAP_HTTP_URL
          value: https://lldap.becklab.cloud
        ports:
        - containerPort: 3890
          name: ldap
          protocol: TCP
        - containerPort: 17170
          name: web
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: lldap-data
