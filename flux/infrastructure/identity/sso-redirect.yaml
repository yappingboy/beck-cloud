apiVersion: v1
kind: ConfigMap
metadata:
  name: sso-redirect-html
  namespace: identity
data:
  admin-index.html: "<!DOCTYPE html>\n<html>\n<head><meta charset=\"utf-8\"><title>Signing\
    \ in...</title></head>\n<body><p>Signing in, please wait...</p>\n<script>\n(function()\
    \ {\n  var rd = encodeURIComponent(window.location.href);\n  window.location.replace('https://oauth2.becklab.cloud/oauth2/start?rd='\
    \ + rd);\n})();\n</script>\n</body>\n</html>\n"
  media-index.html: "<!DOCTYPE html>\n<html>\n<head><meta charset=\"utf-8\"><title>Signing\
    \ in...</title></head>\n<body><p>Signing in, please wait...</p>\n<script>\n(function()\
    \ {\n  var rd = encodeURIComponent(window.location.href);\n  window.location.replace('https://oauth2-media.becklab.cloud/oauth2/start?rd='\
    \ + rd);\n})();\n</script>\n</body>\n</html>\n"
  default.conf: "server {\n    listen 80;\n    location / {\n        root /usr/share/nginx/html/admin;\n\
    \        index index.html;\n    }\n    location /media {\n        alias /usr/share/nginx/html/media/;\n\
    \        index index.html;\n        try_files $uri $uri/ /media/index.html;\n\
    \    }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-redirect
  namespace: identity
  labels:
    app: sso-redirect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sso-redirect
  template:
    metadata:
      labels:
        app: sso-redirect
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/admin/index.html
          subPath: admin-index.html
        - name: html
          mountPath: /usr/share/nginx/html/media/index.html
          subPath: media-index.html
        - name: html
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: html
        configMap:
          name: sso-redirect-html
---
apiVersion: v1
kind: Service
metadata:
  name: sso-redirect
  namespace: identity
spec:
  selector:
    app: sso-redirect
  ports:
  - port: 80
    targetPort: 80
