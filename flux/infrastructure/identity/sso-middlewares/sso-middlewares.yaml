# ── New Group SSO Chains (2026-08-08 RBAC Buildout) ──
# Each chain routes through oauth2-redirect-admin → keycloak-forwardauth-admin
# Group membership is enforced by Keycloak's groups claim in the OIDC token.
# The forwardAuth middleware checks /oauth2/auth which verifies groups via oauth2-proxy.

# AUDITORS
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso-auditors-chain
  namespace: identity
spec:
  chain:
    middlewares:
      - name: oauth2-redirect-admin
        namespace: identity
      - name: keycloak-forwardauth-admin
        namespace: identity

