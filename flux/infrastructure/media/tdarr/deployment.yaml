# Auto-split from cluster files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  namespace: media
  labels:
    app: tdarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: tdarr
        image: ghcr.io/haveagitgat/tdarr:2.5.0
        resources:
          limits:
            memory: 2Gi
          requests:
            memory: 1Gi
        env:
        - name: TZ
          value: America/New_York
        - name: PUIG
          value: '1000'
        - name: PGID
          value: '1000'
        - name: serverIP
          value: 0.0.0.0
        - name: serverPort
          value: '8266'
        - name: webUIPort
          value: '8265'
        - name: internalNode
          value: 'true'
        - name: inContainer
          value: 'true'
        - name: ffmpegVersion
          value: '7'
        - name: nodeName
          value: MyInternalNode
        - name: auth
          value: 'false'
        - name: openBrowser
          value: 'true'
        - name: maxLogSizeMB
          value: '10'
        ports:
        - containerPort: 8265
          name: http
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media-shows
          mountPath: /data/shows
        - name: media-anime
          mountPath: /data/anime
        - name: media-movies
          mountPath: /data/movies
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: tdarr-config
      - name: media-shows
        persistentVolumeClaim:
          claimName: media-shows
      - name: media-anime
        persistentVolumeClaim:
          claimName: media-anime
      - name: media-movies
        persistentVolumeClaim:
          claimName: media-movies
