---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  namespace: media
  labels:
    app: tdarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
    spec:
      # Pin to the GPU worker node; TITAN RTX + NVENC verified there.
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-100-11
      containers:
        - name: tdarr
          image: ghcr.io/haveagitgat/tdarr:latest
          resources:
            limits:
              cpu: "8"
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 2Gi
          env:
            - name: TZ
              value: America/New_York
            - name: PUIG
              value: "1000"
            - name: PGID
              value: "1000"
            - name: serverIP
              value: "0.0.0.0"
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "true"
            - name: inContainer
              value: "true"
            - name: ffmpegVersion
              value: "7"
            - name: nodeName
              value: "MyInternalNode"
            - name: auth
              value: "false"
            - name: openBrowser
              value: "true"
            - name: maxLogSizeMB
              value: "10"
            # Cap Node heap below the 4Gi cgroup limit so V8 GCs before the
            # kernel OOM-kills us while indexing ~21k files.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=3072"
            # Persist Tdarr DB2/config onto the tdarr-config PVC; without this
            # the DB lives on the container layer and is wiped on every restart.
            - name: rootDataPath
              value: "/config/serverdata"
          ports:
            - containerPort: 8265
              name: http
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-shows
              mountPath: /data/shows
            - name: media-anime
              mountPath: /data/anime
            - name: media-movies
              mountPath: /data/movies
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: tdarr-config
        - name: media-shows
          persistentVolumeClaim:
            claimName: media-shows
        - name: media-anime
          persistentVolumeClaim:
            claimName: media-anime
        - name: media-movies
          persistentVolumeClaim:
            claimName: media-movies

---
apiVersion: v1
kind: Service
metadata:
  name: tdarr
  namespace: media
spec:
  selector:
    app: tdarr
  ports:
    - name: http
      port: 8265
      targetPort: 8265
      protocol: TCP
  type: ClusterIP
---
