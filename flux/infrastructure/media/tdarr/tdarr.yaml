apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tdarr
  namespace: media
  labels:
    app: tdarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tdarr.becklab.cloud`)
      kind: Rule
      services:
        - name: tdarr
          port: 8265
      middlewares:
        - name: sso-media-chain
          namespace: identity
  tls:
    secretName: tdarr-tls
