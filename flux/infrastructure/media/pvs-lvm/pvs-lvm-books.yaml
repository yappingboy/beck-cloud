# Static local PVs for the book library (CWA) and audiobook shelf (ABS).
# Directories pre-created on k3s-worker-1 2026-11-14:
#   /mnt/media/books            (incl. .cwa-ingest and .deleted subdirs for CWA)
#   /mnt/media/audiobooks
# Same pattern as pvs-lvm.yaml — local volume type, node affinity to the
# worker that owns the LVM disk, capacity informational (45Ti disk, shared).
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-books-lvm
spec:
  capacity:
    storage: 5Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/media/books
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-192-168-100-11
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-audiobooks-lvm
spec:
  capacity:
    storage: 5Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/media/audiobooks
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-192-168-100-11
