apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  namespace: media
  labels:
    app: nzbget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbget
  template:
    metadata:
      labels:
        app: nzbget
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-100-11
      securityContext:
        fsGroup: 1000
      containers:
        - name: nzbget
          image: lscr.io/linuxserver/nzbget:latest
          resources:
            limits:
              cpu: 4000m
              memory: 4Gi
            requests:
              cpu: 800m
              memory: 512Mi
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 6789
              name: http
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-downloads
              mountPath: /downloads
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z localhost 6789
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nzbget-config
        - name: media-downloads
          persistentVolumeClaim:
            claimName: media-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: nzbget
  namespace: media
spec:
  selector:
    app: nzbget
  ports:
    - name: http
      port: 6789
      targetPort: 6789
      protocol: TCP
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nzbget
  namespace: media
  labels:
    app: nzbget
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nzbget.becklab.cloud`)
      kind: Rule
      services:
        - name: nzbget
          port: 6789
      middlewares:
        - name: sso-admin-chain
          namespace: identity
  tls:
    secretName: nzbget-tls
