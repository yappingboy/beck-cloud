# MariaDB StatefulSet + Service
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: media
  labels:
    app: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotweb-secrets
                  key: db_password
            - name: MYSQL_DATABASE
              value: spotweb
            - name: MYSQL_USER
              value: spotweb
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotweb-secrets
                  key: db_password
          ports:
            - containerPort: 3306
              name: mysql
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spotweb
  namespace: media
  labels:
    app: spotweb
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`spotweb.becklab.cloud`)
      kind: Rule
      services:
        - name: spotweb
          port: 80
      middlewares:
        - name: sso-admin-chain
          namespace: identity
  tls:
    secretName: spotweb-tls
