# Auto-split from cluster files
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  schedule: 0 */6 * * *
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      backoffLimit: 3
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: ip-192-168-100-11
          containers:
          - name: recyclarr
            image: ghcr.io/recyclarr/recyclarr:7.4.0
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 128Mi
                cpu: 200m
            volumeMounts:
            - name: config
              mountPath: /config
            - name: recyclarr-config
              mountPath: /recyclarr/config/recyclarr.yml
              subPath: recyclarr.yml
            env:
            - name: RECYCLARR_CONFIG_FILE
              value: /recyclarr/config/recyclarr.yml
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recyclarr-secrets
                  key: sonarr-api-key
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recyclarr-secrets
                  key: radarr-api-key
            terminationGracePeriodSeconds: 60
          restartPolicy: Never
          volumes:
          - name: config
            persistentVolumeClaim:
              claimName: radarr-config
          - name: recyclarr-config
            configMap:
              name: recyclarr-config
