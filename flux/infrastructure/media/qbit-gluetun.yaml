apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbit-gluetun
  namespace: media
  labels:
    app: qbit-gluetun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbit-gluetun
  template:
    metadata:
      labels:
        app: qbit-gluetun
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: '1'
      initContainers:
      - name: gluetun
        restartPolicy: Always
        image: qmcgaw/gluetun:v3.40.2
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: VPN_SERVICE_PROVIDER
          value: private internet access
        - name: VPN_TYPE
          value: openvpn
        - name: OPENVPN_USER
          valueFrom:
            secretKeyRef:
              name: gluetun-vpn-secret
              key: pia-username
        - name: OPENVPN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gluetun-vpn-secret
              key: pia-password
        - name: SERVER_REGIONS
          value: SE Stockholm
        - name: TZ
          value: America/New_York
        - name: DOT
          value: 'on'
        - name: DISABLE_UPDNGX
          value: 'on'
        - name: FIREWALL
          value: 'off'
        - name: FIREWALL_WORKING
          value: 'off'
        - name: FIREWALL_INPUT_PORTS
          value: 8080,8000
        ports:
        - containerPort: 8000
          name: gluetun-ctrl
          protocol: TCP
        volumeMounts:
        - name: gluetun-config
          mountPath: /etc/gluetun
        - name: tun
          mountPath: /dev/net/tun
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - SYS_PTRACE
            drop:
            - ALL
        sysctls:
        - name: net.ipv4.conf.all.src_valid_mark
          value: '1'
      containers:
      - name: qbit
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          capabilities:
            drop:
            - ALL
        image: lscr.io/linuxserver/qbittorrent:2025.2.1
        resources:
          limits:
            cpu: '4'
            memory: 4Gi
          requests:
            cpu: 200m
            memory: 512Mi
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: America/Los_Angeles
        - name: WEBUI_PORT
          value: '8080'
        ports:
        - containerPort: 8080
          name: qbit-webui
          protocol: TCP
        volumeMounts:
        - name: downloads
          mountPath: /downloads
        - name: qbit-config
          mountPath: /config
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - nc -z localhost 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
      volumes:
      - name: downloads
        persistentVolumeClaim:
          claimName: media-downloads
      - name: gluetun-config
        emptyDir: {}
      - name: qbit-config
        persistentVolumeClaim:
          claimName: qbit-config
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        runAsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: qbit-gluetun
  namespace: media
spec:
  selector:
    app: qbit-gluetun
  ports:
  - name: qbit-webui
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbit-gluetun
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: identity-qbittorrent-role-chain@kubernetescrd
spec:
  tls:
  - hosts:
    - qbit.becklab.cloud
    secretName: qbit-tls
  rules:
  - host: qbit.becklab.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qbit-gluetun
            port:
              number: 8080
