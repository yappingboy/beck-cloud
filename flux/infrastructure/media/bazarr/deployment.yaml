# Auto-split from cluster files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
  labels:
    app: bazarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-100-11
      securityContext:
#        runAsNonRoot: true
#        runAsUser: 1000
        fsGroup: 1000
#        runAsGroup: 1000
#        supplementalGroups:
#        - 1000
      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:1.4.5
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: America/New_York
        ports:
        - containerPort: 6767
          name: http
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media-movies
          mountPath: /data/movies
        - name: media-shows
          mountPath: /data/shows
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: bazarr-config
      - name: media-movies
        persistentVolumeClaim:
          claimName: media-movies
      - name: media-shows
        persistentVolumeClaim:
          claimName: media-shows
