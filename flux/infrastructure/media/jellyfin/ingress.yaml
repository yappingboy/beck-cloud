# Access without SSO (oauth2-proxy-media /ready returns 500 due to upstream issue)
# TODO: restore SSO when oauth2-proxy-media is fixed
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - jellyfin.becklab.cloud
    secretName: jellyfin-tls
  rules:
  - host: jellyfin.becklab.cloud
    http:
      paths:
      - path: /web
        pathType: Prefix
        backend:
          service:
            name: jellyfin
            port:
              number: 8096
