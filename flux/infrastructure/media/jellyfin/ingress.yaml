# Converted from Kubernetes Ingress to Traefik IngressRoute
# Preserves SSO media chain middleware from original annotation
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.becklab.cloud`)
      kind: Rule
      middlewares:
        - name: sso-media-chain
          namespace: identity
      services:
        - name: jellyfin
          port: 8096
  tls:
    secretName: jellyfin-tls
