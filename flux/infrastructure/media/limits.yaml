apiVersion: v1
kind: LimitRange
metadata:
  name: media-limits
  namespace: media
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: media-quota
  namespace: media
spec:
  hard:
    pods: "20"
    requests.cpu: "6"
    requests.memory: 14Gi
    limits.cpu: "40"
    # 50Gi: tdarr needs an 8Gi pod limit; old pod holds its share during
    # rollout, so 42Gi could never admit it (FailedCreate, Sep 15).
    # Overcommit is fine — worker allocatable is ~153Gi and ns requests stay at 14Gi.
    limits.memory: 50Gi
