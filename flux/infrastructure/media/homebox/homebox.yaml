apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: media
  labels:
    app: homebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homebox
  template:
    metadata:
      labels:
        app: homebox
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-100-11
      securityContext:
        fsGroup: 1000
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:latest
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
            - name: HBOX_AUTH_API_KEY_PEPPER
              value: "WesFL+mZSTT9ySmaLHWSEfO4LXqVYKffBTNReG75e4DpkbDXFTk+xxT+VmMhzY3W"
          ports:
            - containerPort: 7745
              name: http
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/data
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z localhost 7745
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homebox-config
---
apiVersion: v1
kind: Service
metadata:
  name: homebox
  namespace: media
spec:
  selector:
    app: homebox
  ports:
    - name: http
      port: 7745
      targetPort: 7745
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homebox
  namespace: media
  labels:
    app: homebox
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homebox.becklab.cloud`)
      kind: Rule
      services:
        - name: homebox
          port: 7745
      middlewares:
        - name: sso-admin-chain
          namespace: identity
  tls:
    secretName: homebox-tls
