# GridSpace IngressRoutes
# Each app redirects root → subpath (browser URL becomes /mesh/, /kiri/, /form/)
# so relative asset paths in HTML resolve correctly.
# Non-root requests pass through unchanged to the app server.

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kiri-moto
  namespace: gridspace
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kiri.becklab.cloud`)
      kind: Rule
      services:
        - name: gridspace
          port: 8080
      middlewares:
        - name: gridspace-kiri-root-redirect
  tls:
    secretName: kiri-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mesh-tool
  namespace: gridspace
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mesh.becklab.cloud`)
      kind: Rule
      services:
        - name: gridspace
          port: 8080
      middlewares:
        - name: gridspace-mesh-root-redirect
  tls:
    secretName: mesh-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: void-form
  namespace: gridspace
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`void.becklab.cloud`)
      kind: Rule
      services:
        - name: gridspace
          port: 8080
      middlewares:
        - name: gridspace-void-root-redirect
  tls:
    secretName: void-tls
