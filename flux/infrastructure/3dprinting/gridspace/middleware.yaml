# Kiri:Moto — 3D Slicer for printers, CNC mills, and laser cutters (public)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gridspace-kiri-root-redirect
  namespace: gridspace
spec:
  redirectRegex:
    regex: "^https://kiri\\.becklab\\.cloud/$"
    replacement: https://kiri.becklab.cloud/kiri/
    permanent: true
---
