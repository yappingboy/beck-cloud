apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridspace
  namespace: 3dprinting
  labels:
    app: gridspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gridspace
  template:
    metadata:
      labels:
        app: gridspace
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-100-11
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        runAsGroup: 1000
        supplementalGroups:
        - 1000
      imagePullSecrets:
      - name: ghcr-credentials
      containers:
      - name: gridspace
        image: ghcr.io/yappingboy/becklab-gridspace:0.11.0
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: America/Los_Angeles
        - name: NODE_ENV
          value: production
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /boot/
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /boot/
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: gridspace-data