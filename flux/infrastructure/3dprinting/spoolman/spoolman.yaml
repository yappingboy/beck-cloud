# Spoolman — filament spool manager
# ghcr.io/donkie/spoolman:latest, container port 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoolman-app
  namespace: 3dprinting
  labels:
    app: spoolman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spoolman
  template:
    metadata:
      labels:
        app: spoolman
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 1000
      containers:
        - name: filament-tracker
          image: ghcr.io/donkie/spoolman:latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: America/New_York
            # Override K8s auto-injected SPOOLMAN_SERVICE_* vars that conflict with Spoolman's config
            - name: SPOOLMAN_HOST
              value: "0.0.0.0"
            - name: SPOOLMAN_PORT
              value: "8000"
          volumeMounts:
            - name: data
              mountPath: /home/app/.local/share/spoolman
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spoolman-data
---
apiVersion: v1
kind: Service
metadata:
  name: spoolman
  namespace: 3dprinting
spec:
  selector:
    app: spoolman
  ports:
    - port: 7912
      targetPort: 8000
  type: ClusterIP
---
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spoolman
  namespace: 3dprinting
  labels:
    app: spoolman
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`spoolman.becklab.cloud`)
      kind: Rule
      services:
        - name: spoolman
          port: 7912
      middlewares:
        - name: sso-admin-chain
          namespace: identity
  tls:
    secretName: spoolman-tls
