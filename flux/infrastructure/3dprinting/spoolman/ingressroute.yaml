# Spoolman — Filament inventory tracker (SSO protected)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spoolman
  namespace: 3dprinting
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: identity-sso-admin-chain@kubernetescrd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`spoolman.becklab.cloud`)
      kind: Rule
      services:
        - name: spoolman
          port: 7912
  tls:
    secretName: spoolman-tls