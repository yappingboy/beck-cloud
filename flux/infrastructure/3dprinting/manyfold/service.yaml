apiVersion: v1
kind: Service
metadata:
  name: manyfold-db
  namespace: 3dprinting
spec:
  selector:
    app: manyfold-db
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: manyfold-redis
  namespace: 3dprinting
spec:
