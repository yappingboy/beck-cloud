  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: manyfold
  namespace: 3dprinting
spec:
  selector:
    app: manyfold
  ports:
  - port: 3214
    targetPort: 3214
  type: ClusterIP