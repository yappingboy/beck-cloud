# Manyfold — 3D asset library / model repository (SSO protected)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: manyfold
  namespace: 3dprinting
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: identity-sso-admin-chain@kubernetescrd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`manyfold.becklab.cloud`)
      kind: Rule
      services:
        - name: manyfold
          port: 3214
  tls:
    secretName: manyfold-tls