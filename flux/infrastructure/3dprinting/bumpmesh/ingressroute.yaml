# BumpMesh — Mesh repair tool (public, no SSO needed)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bumpmesh
  namespace: 3dprinting
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`bump.becklab.cloud`)
      kind: Rule
      services:
        - name: bumpmesh
          port: 80
  tls:
    secretName: bumpmesh-tls