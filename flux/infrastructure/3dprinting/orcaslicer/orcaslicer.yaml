# OrcaSlicer — web-accessible 3D slicer (noVNC-based, single HTTPS port)
# linuxserver/orca-slicer:latest, port 3001 (HTTPS with self-signed cert)
# Access at https://slicer.becklab.cloud (Traefik provides real TLS + admin SSO)
# NOTE: reverse proxy must skip upstream SSL verification
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcaslicer
  namespace: 3dprinting
  labels:
    app: orcaslicer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orcaslicer
  template:
    metadata:
      labels:
        app: orcaslicer
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-100-11
      securityContext:
        fsGroup: 1000
      containers:
        - name: orca-slicer
          image: ghcr.io/linuxserver/orcaslicer:latest
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: 500m
              memory: 2Gi
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 3001
              name: https
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: orcaslicer-config
---
apiVersion: v1
kind: Service
metadata:
  name: orcaslicer
  namespace: 3dprinting
spec:
  selector:
    app: orcaslicer
  ports:
    - port: 3001
      targetPort: 3001
      name: https
  type: ClusterIP
---
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orcaslicer
  namespace: 3dprinting
  labels:
    app: orcaslicer
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`slicer.becklab.cloud`)
      kind: Rule
      services:
        - name: orcaslicer
          port: 3001
      middlewares:
        - name: sso-admin-chain
          namespace: identity
  tls:
    secretName: orcaslicer-tls
