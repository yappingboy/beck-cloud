## Copied to root volumeclaims.yaml
# PVCs for 3D printing services
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manyfold-config
  namespace: 3dprinting
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: manyfold-libraries-lvm
spec:
  capacity:
    storage: 5Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/media/3d-models
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-192-168-100-11

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manyfold-libraries
  namespace: 3dprinting
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""       # static binding — matches media-movies-lvm PV
  volumeName: manyfold-libraries-lvm
  resources:
    requests:
      storage: 5Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fdm-monster-media
  namespace: 3dprinting
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fdm-monster-database
  namespace: 3dprinting
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spoolman-data
  namespace: 3dprinting
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orcaslicer-config
  namespace: 3dprinting
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
