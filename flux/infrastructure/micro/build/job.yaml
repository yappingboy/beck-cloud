apiVersion: batch/v1
kind: Job
metadata:
  name: redis-stability-test
  namespace: micro
  labels:
    test: redis-stability
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      containers:
      - name: test
        image: redis:7-alpine
        command:
        - sh
        - -c
        - "REDIS_HOST=\"${REDIS_HOST:-redis-becklab-redis.redis.svc.cluster.local}\"\
          \nREDIS_PORT=\"${REDIS_PORT:-6379}\"\necho \"=== Redis Connection Stability\
          \ Test ===\"\necho \"Target: $REDIS_HOST:$REDIS_PORT\"\necho \"\"\nERRORS=0\n\
          for i in $(seq 1 50); do\n  RESULT=$(redis-cli -h $REDIS_HOST -p $REDIS_PORT\
          \ PING 2>&1)\n  if [ \"$RESULT\" != \"PONG\" ]; then\n    echo \"FAIL at\
          \ iteration $i: $RESULT\"\n    ERRORS=$((ERRORS + 1))\n  fi\ndone\necho\
          \ \"\"\necho \"Total pings: 50\"\necho \"Errors: $ERRORS\"\nif [ $ERRORS\
          \ -eq 0 ]; then\n  echo \"Redis stability test PASSED\"\nelse\n  echo \"\
          Redis stability test FAILED ($ERRORS errors)\"\n  exit 1\nfi\necho \"\"\n\
          echo \"=== Redis Memory Test ===\"\n# Set keys with 24h TTL and verify they\
          \ exist\nfor i in $(seq 1 10); do\n  redis-cli -h $REDIS_HOST -p $REDIS_PORT\
          \ SET \"test:key:$i\" \"value_$i\" EX 86400\ndone\necho \"Set 10 test keys\
          \ with 24h TTL\"\n# Verify they exist\nCOUNT=$(redis-cli -h $REDIS_HOST\
          \ -p $REDIS_PORT DBSIZE)\necho \"Current DB size: $COUNT\"\n# Clean up test\
          \ keys\nfor i in $(seq 1 10); do\n  redis-cli -h $REDIS_HOST -p $REDIS_PORT\
          \ DEL \"test:key:$i\"\ndone\necho \"Cleaned up test keys\"\n"
      restartPolicy: Never
