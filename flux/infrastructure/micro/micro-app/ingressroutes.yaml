# -----------------------------------------------------------
# 13. Auth Service (admin page, IP allowlist)
# -----------------------------------------------------------
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-admin
  namespace: micro
  labels:
    app: auth-micro
    service: micro
    admin: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.tools.becklab.cloud`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: rate-limit-hash
          namespace: micro
        - name: micro-ip-whitelist
          namespace: micro
        - name: micro-maxbody-default
          namespace: micro
      services:
        - name: auth-micro
          port: 8080
  tls:
    secretName: tools-tls
