# ============================================================
# IngressRoute Templates for Micro Services
# ============================================================
# Pattern:
#   - All services: security-headers + rate-limit-<svc> + micro-maxbody-default
#   - Browser-facing (editor, beckflow): + cors-<svc>
#   - Paid-tier services: + auth-micro-paid
#   - Admin pages: + micro-ip-whitelist
#   - Image services (resize, editor): micro-maxbody-image instead of default
#
# TLS uses the shared tools-tls secret (wildcard cert)
# All routes use websecure entrypoint (HTTPS only)
# HTTP→HTTPS redirect handled by Traefik's redirect-to-https middleware
# ============================================================

# -----------------------------------------------------------
# 1. Hash Service
# -----------------------------------------------------------
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hash
  namespace: micro
  labels:
    app: hash
    service: micro
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hash.tools.becklab.cloud`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: rate-limit-hash
          namespace: micro
        - name: micro-maxbody-default
          namespace: micro
      services:
        - name: hash-service
          port: 8080
  tls:
    secretName: tools-tls

