# Auth service for micro tier authentication
# Validates API keys against Redis (identity namespace, read-only access)
# Endpoints: POST /auth → validates API key, returns tier + quota
#
# ConfigMap holds the auth service configuration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-micro-config
  namespace: micro
data:
  REDIS_HOST: "redis.identity.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # Redis auth key prefix for micro API keys
  API_KEY_PREFIX: "micro:apikeys:"
  # Default rate limits (per minute, applied at middleware layer)
  FREE_TIER_RATE: "60"
  PAID_TIER_RATE: "600"
  # JWT signing key (placeholder — replaced by SOPS-encrypted secret)
  JWT_KEY_FILE: "/etc/auth/jwt-key"
  # Service port
  PORT: "8080"
  # Health check path
  HEALTH_PATH: "/healthz"
---
# Secret for Redis password (read-only access to identity Redis)
# In production, encrypt with SOPS + age
apiVersion: v1
kind: Secret
metadata:
  name: auth-micro-secrets
  namespace: micro
type: Opaque
stringData:
  redis-password: "n2GhqVLqsP44FbrZRtKIY8JOYyiHuZkVrLI37dJR0TI="
  jwt-key: "9c26eee775015355847f45ce861f9be43e6a8c7ee58c24b59c6b132a9f597e54"
---
# Service account for auth-micro (read-only access to identity Redis)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-micro
  namespace: micro
imagePullSecrets:
  - name: ghcr-credentials
---
# RBAC: allow auth-micro to read secrets in identity namespace (for Redis password)
# Note: K8s RBAC doesn't support cross-namespace secret reads by default.
# The Redis password is instead embedded in the auth-micro-secrets secret above.
# This Role is a placeholder for future expansion (e.g., reading API key DB).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-micro-role
  namespace: micro
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["auth-micro-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-micro-rolebinding
  namespace: micro
subjects:
  - kind: ServiceAccount
    name: auth-micro
    namespace: micro
roleRef:
  kind: Role
  name: auth-micro-role
  apiGroup: rbac.authorization.k8s.io
---
# Deployment for auth-micro
# Uses a lightweight Go binary (distroless base, <5MB image)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-micro
  namespace: micro
  labels:
    app: auth-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-micro
  template:
    metadata:
      labels:
        app: auth-micro
    spec:
      serviceAccountName: auth-micro
      containers:
        - name: auth
          image: ghcr.io/yappingboy/auth-micro:latest
          imagePullPolicy: Always
          command: ["./auth-service"]
          args:
            - "--port=8080"
            - "--redis-host=$(REDIS_HOST)"
            - "--redis-port=$(REDIS_PORT)"
            - "--redis-password-file=/etc/auth/redis-password"
            - "--jwt-key-file=/etc/auth/jwt-key"
            - "--api-key-prefix=micro:apikeys:"
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: auth-micro-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-micro-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-micro-secrets
                  key: redis-password
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-micro-secrets
                  key: jwt-key
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: secrets
              mountPath: /etc/auth
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: secrets
          secret:
            secretName: auth-micro-secrets
---
# Internal service for auth-micro (ClusterIP, not exposed externally)
apiVersion: v1
kind: Service
metadata:
  name: auth-micro
  namespace: micro
  labels:
    app: auth-micro
spec:
  selector:
    app: auth-micro
  ports:
    - port: 8080
      targetPort: 8080
      name: http
      protocol: TCP
  type: ClusterIP
