# ============================================================
# Service Deployment Manifests for Micro Services
# ============================================================
# All services share:
#   - ImagePullSecret: ghcr-credentials
#   - Namespace: micro
#   - Port: 8080
#   - SecurityContext: runAsNonRoot, runAsUser: 1000
#   - Liveness/Readiness probes on /healthz:8080
#   - Prometheus metrics on /metrics:8080 (auto-exposed by container)

# ============================================================
# 1. Hash Service
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hash-deployment
  namespace: micro
  labels:
    app: hasher
    service: micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hasher
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hasher
        service: micro
    spec:
      serviceAccountName: default
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: hasher
          image: ghcr.io/yappingboy/hasher:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              memory: 16Mi
              cpu: 25m
            limits:
              memory: 32Mi
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hash-service
  namespace: micro
  labels:
    app: hasher
    service: micro
spec:
  selector:
    app: hasher
  ports:
    - port: 8080
      targetPort: 8080
      name: http
      protocol: TCP
  type: ClusterIP

