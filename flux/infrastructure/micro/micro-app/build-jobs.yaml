# Kaniko build jobs for all micro services
# Flux will apply these automatically via the micro-app kustomization.
# Each job clones the repo, builds the image, and pushes to GHCR.

# ============================================================
# 1. Hash Service
# ============================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-hash
  namespace: toolbox
  labels:
    app: hash
    build-phase: "1"
spec:
  parallelism: 1
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: kaniko-builder
      initContainers:
        - name: copy-source
          image: alpine/git:latest
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          command: ["sh", "-c", "cd /workspace && git clone --branch main --depth 1 https://github.com/yappingboy/beck-cloud.git src && cp -r /workspace/src/apps-source/tools/hash/* . && cp /workspace/src/apps-source/tools/hash/Dockerfile ."]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.24.0
          args:
            - --dockerfile=/workspace/Dockerfile
            - --context=dir:///workspace
            - --destination=ghcr.io/yappingboy/hash:latest
            - --cache=true
            - --cache-repo=ghcr.io/yappingboy/kaniko-cache
            - --skip-tls-verify
            - --push-retry=3
          resources:
            limits:
              cpu: "1"
              memory: 3Gi
            requests:
              cpu: 250m
              memory: 3Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: docker-config
              mountPath: /kaniko/.docker/config.json
              subPath: .dockerconfigjson
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: workspace
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: ghcr-config

