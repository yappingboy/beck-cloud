# Kaniko build jobs for all micro services
# Run: kubectl apply -f build-jobs.yaml -n toolbox && kubectl wait job -n toolbox --for=condition=ready --all --timeout=30m
# Then: kubectl logs -n toolbox -l job-name=<name> to check progress
# Or run sequentially to save cluster resources

# ============================================================
# 1. Hash Service
# ============================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-hash
  namespace: toolbox
  labels:
    app: hash
    build-phase: "1"
spec:
  template:
    spec:
      serviceAccountName: kaniko-builder
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.24.0
          args:
            - --dockerfile=/workspace/src/Dockerfile
            - --context=/workspace/src/
            - --destination=ghcr.io/yappingboy/hash:latest
            - --cache=true
            - --cache-repo=ghcr.io/yappingboy/kaniko-cache
            - --skip-tls-verify
            - --push-retry=3
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 2Gi
          volumeMounts:
            - name: src
              mountPath: /workspace/src
            - name: docker-config
              mountPath: /kaniko/.docker/
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: src
          hostPath:
            path: /home/openclaw/.openclaw/workspace/beck-cloud/tools/hash
        - name: docker-config
          secret:
            secretName: ghcr-config

