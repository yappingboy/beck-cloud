# -----------------------------------------------------------
# 12. BeckFlow Gateway (beckflow-service)
# -----------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beckflow-service
  namespace: micro
  labels:
    app: beckflow
    service: micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beckflow
  template:
    metadata:
      labels:
        app: beckflow
        service: micro
    spec:
      containers:
        - name: beckflow-gateway
          image: ghcr.io/yappingboy/beckflow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_HOST
              value: redis.identity.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD_FILE
              value: "/etc/auth/redis-password"
          volumeMounts:
            - name: redis-password
              mountPath: /etc/auth
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 20Mi
            limits:
              cpu: 200m
              memory: 50Mi
      volumes:
        - name: redis-password
          secret:
            secretName: auth-micro-secrets
            items:
              - key: redis-password
                path: redis-password
