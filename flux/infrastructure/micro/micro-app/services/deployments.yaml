# ============================================================
# Micro Services Deployments — Phase 5
# All services: single binary, <10MB, <10MB RAM, <100ms response
# Resource limits: 200m CPU, 50Mi memory per service
# ============================================================

# -----------------------------------------------------------
# 1. Hash Service (hash-service)
# -----------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hash-service
  namespace: micro
  labels:
    app: hash
    service: micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hash
  template:
    metadata:
      labels:
        app: hash
        service: micro
    spec:
      containers:
        - name: hasher
          image: ghcr.io/yappingboy/hash:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 200m
              memory: 50Mi
---
