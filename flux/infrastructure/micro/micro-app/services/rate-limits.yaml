# ============================================================
# Updated Rate Limit Middlewares — Phase 5
# Rates converted from daily limits to per-minute averages
# Free tier: daily limits → average req/min (24h = 1440 min)
# ============================================================
---
# Hash: 100 req/day → 0.07/min → use 100/min burst, 10/min sustained (plan baseline)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-hash
  namespace: micro
spec:
  rateLimit:
    average: 100
    burst: 20
    period: 60s
---
