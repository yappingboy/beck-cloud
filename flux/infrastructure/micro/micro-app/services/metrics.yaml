# ============================================================
# Prometheus ServiceMonitors for all Micro Services
# Each service exposes /metrics endpoint in Prometheus format
# ============================================================
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hash-service
  namespace: micro
  labels:
    app: hash
    service: micro
    release: kps-prometheus
spec:
  selector:
    matchLabels:
      app: hash
  namespaceSelector:
    matchNames:
      - micro
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
