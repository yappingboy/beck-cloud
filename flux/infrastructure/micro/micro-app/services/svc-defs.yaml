# ============================================================
# ClusterIP Service Definitions for Micro Services
# All reference the service names used in IngressRoutes
# ============================================================
---
apiVersion: v1
kind: Service
metadata:
  name: hash-service
  namespace: micro
  labels:
    app: hash
    service: micro
spec:
  selector:
    app: hash
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
