# Auto-split from cluster files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaml-json-tool
  namespace: micro
  labels:
    app: yaml-json-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yaml-json-tool
  template:
    metadata:
      labels:
        app: yaml-json-tool
        monitoring: 'true'
    spec:
      imagePullSecrets:
      - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: yaml-json-tool
        image: ghcr.io/yappingboy/micro/yaml-json-tool:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      - name: ghcr-credentials
      securityContext:
        securityContext:
          capabilities:
            drop:
            - ALL
