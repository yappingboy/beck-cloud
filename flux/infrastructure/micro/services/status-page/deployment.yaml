# Auto-split from cluster files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: micro
  labels:
    app: status-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-page
  template:
    metadata:
      labels:
        app: status-page
    spec:
      imagePullSecrets:
      - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: status-page
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
      - name: ghcr-credentials
      securityContext:
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: html
        configMap:
          name: status-page-html
