# Prometheus ServiceMonitors for micro services
# Requires Prometheus Operator (kube-prometheus-stack) installed
# Each service exposes /metrics on port 8080

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: micro-services
  namespace: micro
  labels:
    app: micro-monitoring
spec:
  selector:
    matchLabels:
      monitoring: "true"
  namespaceSelector:
    matchNames:
      - micro
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
# Add monitoring label to all micro service definitions
# Each service's Deployment needs this label:
#   spec.template.metadata.labels:
#     monitoring: "true"
# And Service needs a metrics port:
#   spec.ports:
#     - name: metrics
#       port: 8080
#       targetPort: 8080
