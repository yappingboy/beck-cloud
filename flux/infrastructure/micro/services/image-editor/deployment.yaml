# Auto-split from cluster files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-editor-api
  namespace: micro
  labels:
    app: image-editor-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-editor-api
  template:
    metadata:
      labels:
        app: image-editor-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: image-editor-api
        image: ghcr.io/yappingboy/micro/image-editor-api:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: images
          mountPath: /data/images
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: images
        persistentVolumeClaim:
          claimName: micro-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-editor-frontend
  namespace: micro
  labels:
    app: image-editor-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-editor-frontend
  template:
    metadata:
      labels:
        app: image-editor-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: nginx
        image: ghcr.io/yappingboy/micro/image-editor-frontend:v1.0.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          capabilities:
            drop:
            - ALL
