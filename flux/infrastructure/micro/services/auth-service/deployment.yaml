# Auto-split from cluster files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: micro
  labels:
    app: auth-service
    monitoring: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        monitoring: 'true'
    spec:
      imagePullSecrets:
      - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: auth-service
        image: ghcr.io/yappingboy/micro/auth-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: auth-service-redis
              key: host
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: auth-service-redis
              key: port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-service-redis
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-jwt
              key: secret
        - name: JWT_EXPIRY_HOURS
          value: '720'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      - name: ghcr-credentials
        securityContext:
          capabilities:
            drop:
            - ALL
