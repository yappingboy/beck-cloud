# Auto-split from cluster files
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: micro
  labels:
    app: auth-service
    monitoring: 'true'
spec:
  selector:
    app: auth-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
