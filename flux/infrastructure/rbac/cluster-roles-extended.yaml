# === SECURITY: read-only trivy-system + security namespaces ===
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-reader
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "services", "endpoints", "configmaps", "secrets", "deployments", "replicasets", "jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["trivy.aquasecurity.github.io"]
    resources: ["clusterinstallations", "clusterreports", "cluster VulnerabilityReports", "clusterCompliances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares", "traefikservices"]
