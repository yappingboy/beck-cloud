apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crafty
  namespace: gaming
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: identity-sso-admin-chain@kubernetescrd
spec:
  tls:
  - hosts:
    - crafty.becklab.cloud
    secretName: crafty-tls
  rules:
  - host: crafty.becklab.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: crafty
            port:
              number: 8443