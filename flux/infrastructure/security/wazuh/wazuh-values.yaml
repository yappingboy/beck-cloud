---
# Wazuh HelmRelease for BeckCloud security suite (Phase 1)
# Chart: morgoved/wazuh-helm v2.0.0 (Wazuh app 4.14.3)
# All components pinned to control-plane node for RAM headroom

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wazuh
  namespace: security
spec:
  interval: 1m
  chart:
    spec:
      chart: wazuh
      version: "2.0.0"
      sourceRef:
        kind: HelmRepository
        name: wazuh-helm
        namespace: flux-system
  timeout: 30m
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  values:

    fullnameOverride: wazuh

    # ── Indexer (OpenSearch-based) ──────────────────────────────
    indexer:
      enabled: true
      replicas: 1
      images:
        repository: wazuh/wazuh-indexer
        tag: "4.14.3"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 3Gi
      storage:
        size: 50Gi
      nodeSelector:
        kubernetes.io/hostname: ip-172-16-0-20
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      # Admin/kibanaserver password = WazuhSecretPassword (matches Filebeat config).
      # Corrected hash: $2y$12$4mS3nafjaEBGWwVAK.4YZeU8nbIljVf7swLSs/JL1QJ6QX/92r5mq
      config:
        internalUsers: |
          ---
          _meta:
            type: "internalusers"
            config_version: 2
          admin:
            hash: "$2y$12$4mS3nafjaEBGWwVAK.4YZeU8nbIljVf7swLSs/JL1QJ6QX/92r5mq"
            reserved: true
            backend_roles:
              - "admin"
          kibanaserver:
            hash: "$2y$12$4mS3nafjaEBGWwVAK.4YZeU8nbIljVf7swLSs/JL1QJ6QX/92r5mq"
            reserved: true
            backend_roles:
              - "kibana_server"
        nodes_dn:
          - CN=wazuh-indexer,O=Company,L=California,C=US
          - CN=wazuh-dashboard,O=Wazuh

    # ── Wazuh Manager (master + workers) ────────────────────────
    wazuh:
      replicas: 1
      images:
        repository: wazuh/wazuh-manager
        tag: "4.14.3"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
      storage:
        size: 10Gi
      nodeSelector:
        kubernetes.io/hostname: ip-172-16-0-20
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      master:
        additionalVolumes:
          # Overlay filebeat.yml from ConfigMap to prevent s6 init scripts
          # overwriting it with an empty file on fresh pod starts.
          - name: filebeat-config
            configMap:
              name: wazuh-filebeat-config
        additionalVolumeMounts:
          - name: filebeat-config
            readOnly: true
            mountPath: /etc/filebeat/filebeat.yml
            subPath: filebeat.yml

      worker:
        replicas: 2
        additionalVolumes:
          - name: filebeat-config
            configMap:
              name: wazuh-filebeat-config
        additionalVolumeMounts:
          - name: filebeat-config
            readOnly: true
            mountPath: /etc/filebeat/filebeat.yml
            subPath: filebeat.yml

        volumeMounts:
          - mountPath: /etc/ssl/root-ca.pem
            name: filebeat-certs
            readOnly: true
            subPath: root-ca.pem
          - mountPath: /etc/ssl/filebeat.pem
            name: filebeat-certs
            readOnly: true
            subPath: tls.crt
          - mountPath: /etc/ssl/filebeat.key
            name: filebeat-certs
            readOnly: true
            subPath: tls.key

    # ── Dashboard auth override ──────────────────────────────────
    # Chart default renders opensearch_security.auth.type as ["basicauth","anonymous"] (array).
    # Wazuh 4.14.3 dashboard rejects "anonymous" as valid auth.type and expects a string.
    # Override to "basicauth" (string).
    dashboardCred:
      enabled: true
      username: kibanaserver
      password: "WazuhSecretPassword"
      
    dashboard:
      enabled: true
      cred:
        username: kibanaserver
        password: "WazuhSecretPassword"
      replicas: 1
      images:
        repository: wazuh/wazuh-dashboard
        tag: "4.14.3"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      ingress:
        enabled: true
        className: traefik
        host: wazuh.becklab.cloud
        tls:
          - hosts:
              - wazuh.becklab.cloud
            secretName: wazuh-becklab-cloud-tls
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.middlewares: identity-sso-admin-chain@kubernetescrd
      nodeSelector:
        kubernetes.io/hostname: ip-172-16-0-20
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      livenessProbe:
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 10
        successThreshold: 1
        initialDelaySeconds: 10
        tcpSocket:
          port: 5601
      readinessProbe:
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 10
        successThreshold: 1
        initialDelaySeconds: 10
        tcpSocket:
          port: 5601
      config: |
        server.host: 0.0.0.0
        server.port: 5601
        opensearch.hosts: "https://wazuh-indexer.security.svc.cluster.local:9200"
        opensearch.ssl.verificationMode: none
        opensearch.requestHeadersWhitelist: [ authorization,securitytenant ]
        opensearch_security.multitenancy.enabled: false
        opensearch_security.readonly_mode.roles: ["kibana_read_only"]
        opensearch_security.auth.unauthenticated_routes: ['"/api/stats"', '"/api/status"', '"/api/security/*/status"']
        server.ssl.enabled: false
        server.ssl.key: "/usr/share/wazuh-dashboard/certs/key.pem"
        server.ssl.certificate: "/usr/share/wazuh-dashboard/certs/cert.pem"
        opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/root-ca.pem"]
        uiSettings.overrides.defaultRoute: /app/wz-home
        opensearch_security.auth.multiple_auth_enabled: false
        opensearch_security.auth.type: "basicauth"

    # ── Certificates ─────────────────────────────────────────────
    # Disabled: self-signed certs + Cilium eBPF caused bootstrap deadlocks.
    # Internal comms are isolated by Wazuh NetworkPolicies in security ns.
    # External TLS handled by Traefik ingress + cert-manager.
    certificates:
      enabled: false
