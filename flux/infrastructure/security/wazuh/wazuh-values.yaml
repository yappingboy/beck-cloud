---
# Wazuh HelmRelease for BeckCloud security suite (Phase 1)
# Chart: morgoved/wazuh-helm v2.0.0 (Wazuh app 4.14.3)
# All components pinned to control-plane node for RAM headroom

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wazuh
  namespace: security
spec:
  interval: 1m
  chart:
    spec:
      chart: wazuh
      version: "2.0.0"
      sourceRef:
        kind: HelmRepository
        name: wazuh-helm
        namespace: flux-system
  timeout: 30m
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  values:

    fullnameOverride: wazuh

    # ── Indexer (OpenSearch-based) ──────────────────────────────
    indexer:
      enabled: true
      replicas: 1
      images:
        repository: wazuh/wazuh-indexer
        tag: "4.14.3"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 3Gi
      storage:
        size: 50Gi
      nodeSelector:
        kubernetes.io/hostname: ip-172-16-0-20
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      # Admin/kibanaserver password = WazuhSecretPassword (matches Filebeat config).
      # Bcrypt hash of 'WazuhSecretPassword' ($2b$12$ rounds).
      config:
        internalUsers: |
          ---
          _meta:
            type: "internalusers"
            config_version: 2
          admin:
            hash: "$2b$12$tC.v75r7f6bAY3/k70WxU.iELemhi/dKoX2CHAjkSh5PDojVOTqfO"
            reserved: true
            backend_roles:
              - "admin"
          kibanaserver:
            hash: "$2b$12$tC.v75r7f6bAY3/k70WxU.iELemhi/dKoX2CHAjkSh5PDojVOTqfO"
            reserved: true

    # ── Wazuh Manager (master + workers) ────────────────────────
    wazuh:
      replicas: 1
      images:
        repository: wazuh/wazuh-manager
        tag: "4.14.3"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
      storage:
        size: 10Gi
      nodeSelector:
        kubernetes.io/hostname: ip-172-16-0-20
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      master:
        additionalVolumes:
          # Overlay filebeat.yml from ConfigMap to prevent s6 init scripts
          # overwriting it with an empty file on fresh pod starts.
          - name: filebeat-config
            configMap:
              name: wazuh-filebeat-config
        additionalVolumeMounts:
          - name: filebeat-config
            readOnly: true
            mountPath: /etc/filebeat/filebeat.yml
            subPath: filebeat.yml

      worker:
        replicas: 2
        additionalVolumes:
          - name: filebeat-config
            configMap:
              name: wazuh-filebeat-config
        additionalVolumeMounts:
          - name: filebeat-config
            readOnly: true
            mountPath: /etc/filebeat/filebeat.yml
            subPath: filebeat.yml

    # ── Dashboard auth override ──────────────────────────────────
    # Chart default renders opensearch_security.auth.type as ["basicauth","anonymous"] (array).
    # Wazuh 4.14.3 dashboard rejects "anonymous" as valid auth.type and expects a string.
    # Override to "basicauth" (string).
    dashboard:
      enabled: true
      replicas: 1
      images:
        repository: wazuh/wazuh-dashboard
        tag: "4.14.3"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      ingress:
        enabled: true
        className: traefik
        host: wazuh.becklab.cloud
        tls:
          - hosts:
              - wazuh.becklab.cloud
            secretName: wazuh-becklab-cloud-tls
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.middlewares: identity-sso-admin-chain@kubernetescrd
      nodeSelector:
        kubernetes.io/hostname: ip-172-16-0-20
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      config:
        opensearch_security.auth.type: "basicauth"
        opensearch_security.auth.anonymous_auth_enabled: "true"
        opensearch_security.auth.unauthenticated_routes: '["/api/stats", "/api/status", "/api/security/*/status"]'
        opensearch.http2: false

    # ── Certificates ─────────────────────────────────────────────
    # Disabled: self-signed certs + Cilium eBPF caused bootstrap deadlocks.
    # Internal comms are isolated by Wazuh NetworkPolicies in security ns.
    # External TLS handled by Traefik ingress + cert-manager.
    certificates:
      enabled: false

    # ── Filebeat TLS certificate fix ─────────────────────────────
    # Chart v2.0.0 generates filebeat-tls secret with standard tls.crt/tls.key keys
    # but our custom secret has filebeat.pem/filebeat.key (renamed for clarity).
    # The filebeat-certs secret also has root-ca.pem (indexer CA) in addition to ca.crt.
    # Override the volume mount subPaths to match our secret's key names.
    wazuh:
      master:
        volumeMounts:
          - mountPath: /etc/ssl/root-ca.pem
            name: filebeat-certs
            readOnly: true
            subPath: root-ca.pem
          - mountPath: /etc/ssl/filebeat.pem
            name: filebeat-certs
            readOnly: true
            subPath: tls.crt
          - mountPath: /etc/ssl/filebeat.key
            name: filebeat-certs
            readOnly: true
            subPath: tls.key
      worker:
        volumeMounts:
          - mountPath: /etc/ssl/root-ca.pem
            name: filebeat-certs
            readOnly: true
            subPath: root-ca.pem
          - mountPath: /etc/ssl/filebeat.pem
            name: filebeat-certs
            readOnly: true
            subPath: tls.crt
          - mountPath: /etc/ssl/filebeat.key
            name: filebeat-certs
            readOnly: true
            subPath: tls.key
