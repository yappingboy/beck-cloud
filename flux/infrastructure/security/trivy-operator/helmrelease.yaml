# Auto-split from cluster files
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: security
spec:
  interval: 1m
  chart:
    spec:
      chart: trivy-operator
      version: 0.32.0
      sourceRef:
        kind: HelmRepository
        name: aqua-charts
        namespace: flux-system
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    trivy:
      image:
        repository: docker.io/aquasec/trivy
        tag: 0.68.1
        pullPolicy: IfNotPresent
      ignoreUnfixed: true
      offlineScan: false
    operator:
      replicas: 1
      excludeNamespaces:
      - kube-system
      - trivy-system
      - cert-manager
      - monitoring
      - cattle-system
      scanInterval: 12h
      metricsPort: 8080
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 1Gi
    trivyCache:
      enabled: true
      volumeSize: 10Gi
      nodeSelector:
        kubernetes.io/hostname: ip-172-16-0-20
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    rbac:
      clusterWide: true
