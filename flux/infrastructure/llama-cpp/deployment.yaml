apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llama-cpp
  labels:
    app: llama-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      containers:
      - name: llama-server
        image: ghcr.io/niko1221/strata:0.2.7-cuda13
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        env:
          - name: MODEL
            value: "UD-IQ4_XS"
          - name: CONTEXT
            value: "256k"
          - name: VISION
            value: "on"
          - name: TUNE
            value: "thorough"
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
            name: unsloth
          - containerPort: 22
            name: ssh
        resources:
          limits:
            nvidia.com/gpu: 1
#            cpu: "14"
#            memory: "110Gi"
          requests:
            nvidia.com/gpu: 1
#            cpu: "14"
#            memory: "110Gi"
        volumeMounts:
          - name: models
            mountPath: /data
#            readOnly: true
          - name: dshm
            mountPath: /dev/shm
      volumes:
        # Replaces -v ~/ollama:/models
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
        # Replaces --ipc=host by providing full POSIX shared memory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: unsloth-service
  namespace: llama-cpp
spec:
  type: NodePort
  selector:
    app: llama-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 31000  # Maps external port 30888 on your host to 8080 inside the pod
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-service
  namespace: llama-cpp
spec:
  type: NodePort
  selector:
    app: llama-server
  ports:
    - protocol: TCP
      port: 22
      targetPort: 22
      nodePort: 31022  # Maps external port 30888 on your host to 8080 inside the pod
