apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llama-cpp
  labels:
    app: llama-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:full-cuda
        env:
          - name: OMP_NUM_THREADS
            value: "20"
          - name: GOMP_CPU_AFFINITY
            value: "0-20"
        imagePullPolicy: IfNotPresent
        args:
          - "--server"
          - "-m"
          - "/models/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8080"
          - "--threads"
          - "20"
          - "--threads-batch"
          - "20"
          - "--flash-attn"
          - "on"
          - "--cache-type-k"
          - "q4_0"
          - "--cache-type-v"
          - "q4_0"
          - "-c"
          - "262144"
#          - "--spec-type" 
#          - "draft-mtp" 
#          - "--spec-draft-n-max" 
#          - "2"
#          - "-md" 
#          - "/models/MTP/mtp-Qwen3.8-Flash-Next-Q8_0.gguf"
        ports:
          - containerPort: 8080
            name: http
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: "20"
            memory: "80Gi"
          requests:
            nvidia.com/gpu: 1
            cpu: "20"
            memory: "48Gi"
        volumeMounts:
          - name: models
            mountPath: /models
            readOnly: true
          - name: dshm
            mountPath: /dev/shm
      volumes:
        # Replaces -v ~/ollama:/models
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
        # Replaces --ipc=host by providing full POSIX shared memory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server-service
  namespace: llama-cpp
spec:
  type: NodePort
  selector:
    app: llama-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 31888  # Maps external port 30888 on your host to 8080 inside the pod
