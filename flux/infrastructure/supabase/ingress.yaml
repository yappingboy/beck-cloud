# Expose Supabase Kong gateway at supabase.becklab.cloud.
# No SSO here: Supabase auth (GoTrue) endpoints must be reachable without a
# Keycloak session so CADAM's anon-key signInWithPassword / signUp / token
# refresh work. Auth is enforced by the anon/service keys + Postgres RLS.
# CADAM is the only client routed through this host today.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: supabase
  namespace: supabase
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`supabase.becklab.cloud`)
      kind: Rule
      services:
        - name: supabase-supabase-kong
          port: 8000
          scheme: http
  tls:
    secretName: supabase-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: supabase
  namespace: supabase
spec:
  secretName: supabase-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - supabase.becklab.cloud
