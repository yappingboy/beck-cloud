# Supabase self-host — CADAM backend (auth + postgres + postgrest + storage)
# Chart: supabase-community/supabase (Helm, not the early-stage Operator)
# Auth federates to Keycloak (realm homelab) via gotrue's keycloak provider.
# CADAM's own DB schema (supabase/schemas + migrations) is applied separately
# via a one-shot Job, NOT the chart's `migration.sql` (too large to inline).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supabase
  namespace: supabase
spec:
  interval: 1h
  chart:
    spec:
      chart: supabase
      version: "0.7.2"
      sourceRef:
        kind: HelmRepository
        name: supabase
        namespace: flux-system
  values:
    # --- credentials: pulled from SOPS-encrypted supabase-secrets ---
    # The secret holds BOTH flat keys (jwtAnonKey, dbPassword, ... used by the
    # environment blocks below) AND nested keys (.jwt.secret, .db.password, ...
    # used natively by the chart's secret.* resolution). Only secretRef +
    # secretRefKey are set here — do NOT add empty-string value overrides:
    # the chart treats a set value as "no ref" and silently drops the ref.
    secret:
      jwt:
        secretRef: supabase-secrets
        secretRefKey:
          anonKey: jwtAnonKey
          serviceKey: jwtServiceKey
          secret: jwtSecret
      db:
        secretRef: supabase-secrets
        secretRefKey:
          password: dbPassword
          database: dbDatabase
      dashboard:
        secretRef: supabase-secrets
        secretRefKey:
          username: dashUsername
          password: dashPassword
          openAiApiKey: dashOpenAiKey
      realtime:
        secretRef: supabase-secrets
        secretRefKey:
          secretKeyBase: rtSecretKeyBase
          dbEncKey: rtDbEncKey
      meta:
        secretRef: supabase-secrets
        secretRefKey:
          cryptoKey: metaCryptoKey
      minio:
        secretRef: supabase-secrets
        secretRefKey:
          user: minioUser
          password: minioPassword
      s3:
        secretRef: supabase-secrets
        secretRefKey:
          keyId: s3KeyId
          accessKey: s3AccessKey
      smtp:
        secretRef: supabase-secrets
        secretRefKey:
          username: smtpUsername
          password: smtpPassword

    # --- trim the stack: disable analytics + functions we don't use ---
    deployment:
      analytics:
        enabled: false
      functions:
        enabled: false
      studio:
        enabled: true
      auth:
        enabled: true
      db:
        enabled: true
      rest:
        enabled: true
      storage:
        enabled: true
      realtime:
        enabled: true
      meta:
        enabled: true
      minio:
        enabled: true
      imgproxy:
        enabled: true
      kong:
        enabled: true
      vector:
        enabled: false
      db:
        # Mount a custom pg_hba.conf that adds a trust rule for the reserved
        # superuser 'supabase_admin' on the pod CIDR. The reserved role's SCRAM
        # verifier is baked into the AMI image and CANNOT be changed (ALTER USER
        # fails with 'reserved role'; init script runs as the demoted non-superuser
        # postgres role). Realtime connects as supabase_admin over 10.0.0.0/8 and
        # can only authenticate via a trust rule. Homelab-only, single-tenant,
        # Cilium-isolated — acceptable.
        volumes:
          - name: pg-hba-custom
            configMap:
              name: supabase-pg-hba
        volumeMounts:
          - name: pg-hba-custom
            mountPath: /etc/postgresql/pg_hba.conf
            subPath: pg_hba.conf

    # --- gotrue auth env ---
    # NOTE: environment.* lists REPLACE the chart defaults (Helm list semantics),
    # so this list must include every chart-default var we still want.
    # Base values copied from chart v0.7.2 values.yaml environment.auth,
    # with our overrides applied (URLs, Keycloak provider, autoconfirm).
    environment:
      auth:
        # chart defaults (kept)
        - name: GOTRUE_API_HOST
          value: "0.0.0.0"
        - name: GOTRUE_API_PORT
          value: "9999"
        - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
          value: authenticated
        - name: GOTRUE_JWT_ADMIN_ROLES
          value: service_role
        - name: GOTRUE_JWT_AUD
          value: authenticated
        - name: GOTRUE_JWT_EXP
          value: "3600"
        - name: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
          value: "false"
        - name: GOTRUE_EXTERNAL_PHONE_ENABLED
          value: "false"
        - name: GOTRUE_SMS_AUTOCONFIRM
          value: "true"
        - name: GOTRUE_MAILER_URLPATHS_INVITE
          value: /auth/v1/verify
        - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
          value: /auth/v1/verify
        - name: GOTRUE_MAILER_URLPATHS_RECOVERY
          value: /auth/v1/verify
        - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
          value: /auth/v1/verify
        # our overrides
        - name: API_EXTERNAL_URL
          value: http://supabase-supabase-auth.supabase.svc.cluster.local:9999
        - name: GOTRUE_SITE_URL
          value: https://cadam.becklab.cloud
        - name: GOTRUE_URI_ALLOW_LIST
          value: https://cadam.becklab.cloud
        - name: GOTRUE_DISABLE_SIGNUP
          value: "false"
        - name: GOTRUE_MAILER_AUTOCONFIRM
          value: "true"
        - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
          value: "true"
        # Keycloak OIDC provider (realm homelab, client cadam-sso)
        - name: GOTRUE_EXTERNAL_KEYCLOAK_ENABLED
          value: "true"
        - name: GOTRUE_EXTERNAL_KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: KEYCLOAK_CLIENT_ID
        - name: GOTRUE_EXTERNAL_KEYCLOAK_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: KEYCLOAK_CLIENT_SECRET
        - name: GOTRUE_EXTERNAL_KEYCLOAK_URL
          value: https://keycloak.becklab.cloud/realms/homelab
        - name: GOTRUE_EXTERNAL_KEYCLOAK_REDIRECT_URI
          value: https://supabase.becklab.cloud/auth/v1/callback
        # gotrue provider name shown on the login screen
        - name: GOTRUE_EXTERNAL_KEYCLOAK_REDIRECT_ENABLED
          value: "true"
        # SMTP: none (autoconfirm on; no mail server in the homelab)
        - name: GOTRUE_SMTP_ADMIN_EMAIL
          value: admin@becklab.cloud
        - name: GOTRUE_SMTP_HOST
          value: ""
        - name: GOTRUE_SMTP_PORT
          value: "25"
        - name: GOTRUE_SMTP_SENDER_NAME
          value: BeckCloud
      studio:
        # chart defaults (kept)
        - name: HOSTNAME
          value: "::"
        - name: STUDIO_PORT
          value: "3000"
        - name: DEFAULT_ORGANIZATION_NAME
          value: Default Organization
        - name: DEFAULT_PROJECT_NAME
          value: Default Project
        - name: NEXT_ANALYTICS_BACKEND_PROVIDER
          value: postgres
        # our override
        - name: SUPABASE_PUBLIC_URL
          value: http://supabase-supabase-kong.supabase.svc.cluster.local:8000

    # persistence sizes (local-path provisioner)
    persistence:
      db:
        enabled: true
        size: 20Gi
      minio:
        enabled: true
        size: 5Gi
      storage:
        enabled: true
        size: 5Gi
      imgproxy:
        enabled: true
        size: 1Gi
      snippets:
        enabled: true
        size: 1Gi
      pgsodium:
        enabled: true
        size: 100Mi
      # functions disabled above; keep PVCs off
      functions:
        enabled: false
      deno:
        enabled: false

    # no built-in ingress — we add a Traefik IngressRoute for supabase.becklab.cloud
    ingress:
      enabled: false
