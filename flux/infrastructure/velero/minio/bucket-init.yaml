apiVersion: batch/v1
kind: Job
metadata:
  name: minio-make-bucket
  namespace: velero
  labels:
    app: minio
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          # quay.io/minio/mc is now auth-gated for anonymous pulls (401).
          # The minio server image bundles /usr/bin/mc and is cached on our nodes.
          image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mc alias set myminio http://minio.velero.svc.cluster.local:9000 beck-minio 'beck-minio-secret-2026'
              mc mb myminio/velero-backups --ignore-existing
              echo "Bucket created successfully"
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
