apiVersion: v1
kind: LimitRange
metadata:
  name: webapps-limits
  namespace: webapps
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: webapps-quota
  namespace: webapps
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: 6Gi
    # 2026-08-17: raised from 8/12Gi to fit ToolJet (2 CPU/3 Gi limit).
    # Worker node has ~32 GiB RAM, 18 GiB free at raise time.
    limits.cpu: "12"
    limits.memory: 16Gi
