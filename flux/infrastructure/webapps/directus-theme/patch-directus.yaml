apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: webapps
spec:
  template:
    spec:
      containers:
        - name: directus
          env:
            - name: DIRECTUS_BRAND_COLOR
              value: "#E8A838"
            - name: DIRECTUS_BRAND_NAME
              value: "BeckCloud"
            - name: DIRECTUS_BRAND_LOGO
              value: "https://becklab.cloud/logo.svg"
          volumeMounts:
            - name: brand-theme
              mountPath: /directus/public/brand.css
              subPath: brand.css
              readOnly: true
      volumes:
        - name: brand-theme
          configMap:
            name: directus-brand-theme
            items:
              - key: brand.css
                path: brand.css
