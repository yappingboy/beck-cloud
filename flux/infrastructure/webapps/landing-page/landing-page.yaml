apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-httpd
  namespace: webapps
data:
  apache2.conf: "ServerRoot \"/etc/apache2\"\nListen 80\n\n# Minimal modules for Debian\
    \ Apache 2.4\nLoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so\n\
    LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so\nLoadModule\
    \ authz_host_module /usr/lib/apache2/modules/mod_authz_host.so\nLoadModule headers_module\
    \ /usr/lib/apache2/modules/mod_headers.so\nLoadModule deflate_module /usr/lib/apache2/modules/mod_deflate.so\n\
    LoadModule filter_module /usr/lib/apache2/modules/mod_filter.so\nLoadModule wsgi_module\
    \ /usr/lib/apache2/modules/mod_wsgi.so\nLoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so\n\
    LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so\n\
    \nUser www-data\nGroup www-data\n\nServerAdmin admin@becklab.cloud\nServerName\
    \ becklab.cloud\nDocumentRoot \"/hosting\"\n\nErrorLog /proc/self/fd/2\nLogLevel\
    \ warn\nLogFormat \"%h %l %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\
    \"\" combined\nCustomLog /proc/self/fd/1 combined\n\nTimeout 300\nKeepAlive Off\n\
    MaxRequestWorkers 50\n\n# Django via mod_wsgi \u2014 all requests go through Django\n\
    WSGIDaemonProcess landing processes=2 threads=15 maximum-requests=10000 display-name=%{GROUP}\
    \ python-path=/app:/usr/local/lib/python3.12/site-packages user=www-data group=www-data\n\
    WSGIProcessGroup landing\nWSGIScriptAlias / /app/beckcloud/wsgi.py process-group=landing\n\
    \n<Directory \"/app/beckcloud\">\n    <Files wsgi.py>\n        Require all granted\n\
    \    </Files>\n</Directory>\n\n# Security headers\nHeader always set X-Content-Type-Options\
    \ nosniff\nHeader always set X-Frame-Options SAMEORIGIN\nHeader always set X-XSS-Protection\
    \ \"1; mode=block\"\nHeader always set Referrer-Policy strict-origin-when-cross-origin\n\
    Header always unset X-Powered-By\n\n# Compression\nAddOutputFilterByType DEFLATE\
    \ text/html text/css application/javascript application/json image/svg+xml\n\n\
    # Caching for static assets\n<FilesMatch \"\\.(css|js|svg|ico|png|jpg|gif|webp|woff2|woff|ttf)$\"\
    >\n    Header set Cache-Control \"public, max-age=86400\"\n</FilesMatch>\n\n<FilesMatch\
    \ \"^robots\\.txt$\">\n    Header set Cache-Control \"public, max-age=3600\"\n\
    </FilesMatch>\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-django
  namespace: webapps
data:
  settings.py: "import os\n\nBASE_DIR = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))\n\
    SECRET_KEY = os.environ.get(\"DJANGO_SECRET_KEY\", \"beckcloud-landing-insecure-key\"\
    )\nDEBUG = False\nALLOWED_HOSTS = [\"*\"]\n\nINSTALLED_APPS = [\n    \"django.contrib.contenttypes\"\
    ,\n    \"django.contrib.staticfiles\",\n]\n\nMIDDLEWARE = [\n    \"django.middleware.security.SecurityMiddleware\"\
    ,\n    \"django.middleware.common.CommonMiddleware\",\n    \"django.middleware.clickjacking.XFrameOptionsMiddleware\"\
    ,\n]\n\nROOT_URLCONF = \"beckcloud.urls\"\n\nTEMPLATES = [\n    {\n        \"\
    BACKEND\": \"django.template.backends.django.DjangoTemplates\",\n        \"DIRS\"\
    : [os.environ.get(\"HOSTING_DIR\", \"/hosting\")],\n        \"APP_DIRS\": False,\n\
    \        \"OPTIONS\": {\n            \"context_processors\": [\n             \
    \   \"django.template.context_processors.request\",\n            ],\n        },\n\
    \    },\n]\n\nWSGI_APPLICATION = \"beckcloud.wsgi.application\"\nSTATIC_URL =\
    \ \"/static/\"\nDEFAULT_AUTO_FIELD = \"django.db.models.BigAutoField\"\n\nLOGGING\
    \ = {\n    \"version\": 1,\n    \"disable_existing_loggers\": False,\n    \"handlers\"\
    : {\n        \"console\": {\"class\": \"logging.StreamHandler\"},\n    },\n  \
    \  \"root\": {\"handlers\": [\"console\"], \"level\": \"WARNING\"},\n    \"loggers\"\
    : {\n        \"django\": {\"handlers\": [\"console\"], \"level\": \"WARNING\"\
    , \"propagate\": False},\n    },\n}\n"
  urls.py: "from django.urls import path\nfrom django.views.static import serve\n\
    from django.http import JsonResponse, HttpResponse, HttpResponseNotFound\nimport\
    \ os\n\nhosting = os.environ.get(\"HOSTING_DIR\", \"/hosting\")\n\ndef health_check(request):\n\
    \    return JsonResponse({\"status\": \"ok\", \"service\": \"beckcloud-landing\"\
    })\n\ndef index_api(request):\n    return JsonResponse({\n        \"name\": \"\
    BeckCloud\",\n        \"tagline\": \"Built by one. Running for all.\",\n     \
    \   \"description\": \"A self-hosted homelab running K3s.\",\n    })\n\ndef index_view(request):\n\
    \    import re\n    idx = os.path.join(hosting, \"index.html\")\n    try:\n  \
    \      with open(idx, \"r\", encoding=\"utf-8\") as f:\n            content =\
    \ f.read()\n        content = re.sub(r'^---[\\s\\S]*?---\\s*', '', content)\n\
    \        return HttpResponse(content, content_type=\"text/html; charset=utf-8\"\
    )\n    except FileNotFoundError:\n        return HttpResponseNotFound(\"<h1>404</h1>\"\
    )\n\ndef profile_view(request):\n    profile_path = os.path.join(hosting, \"profile.html\"\
    )\n    try:\n        with open(profile_path, \"r\", encoding=\"utf-8\") as f:\n\
    \            content = f.read()\n        return HttpResponse(content, content_type=\"\
    text/html; charset=utf-8\")\n    except FileNotFoundError:\n        return HttpResponseNotFound(\"\
    <h1>404 - Profile page not found</h1>\")\n\nurlpatterns = [\n    path(\"\", index_view,\
    \ name=\"home\"),\n    path(\"robots.txt\", serve, {\"path\": \"robots.txt\",\
    \ \"document_root\": hosting}, name=\"robots\"),\n    path(\"favicon.svg\", serve,\
    \ {\"path\": \"favicon.svg\", \"document_root\": hosting}, name=\"favicon\"),\n\
    \    path(\"css/<path:path>\", serve, {\"document_root\": os.path.join(hosting,\
    \ \"css\")}, name=\"css\"),\n    path(\"js/<path:path>\", serve, {\"document_root\"\
    : os.path.join(hosting, \"js\")}, name=\"js\"),\n    path(\"api/health/\", health_check,\
    \ name=\"health\"),\n    path(\"api/\", index_api, name=\"index\"),\n    path(\"\
    api\", index_api, name=\"index-noslash\"),\n    path(\"profile\", profile_view,\
    \ name=\"profile\"),\n]\n"
  wsgi.py: 'import os

    from django.core.wsgi import get_wsgi_application


    os.environ.setdefault("DJANGO_SETTINGS_MODULE", "beckcloud.settings")

    application = get_wsgi_application()

    '
  __init__.py: '# BeckCloud landing page Django app

    '
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: webapps
  labels:
    app: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      imagePullSecrets:
      - name: ghcr-credentials
      initContainers:
      - name: fix-permissions
        image: ghcr.io/yappingboy/becklab-landing:latest
        command:
        - sh
        - -c
        - chmod -R a+r /hosting && chmod -R a+X /hosting
        volumeMounts:
        - name: hosting
          mountPath: /hosting
          readOnly: false
        resources:
          limits:
            memory: 32Mi
            cpu: 100m
      containers:
      - name: landing
        image: ghcr.io/yappingboy/becklab-landing:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            memory: 128Mi
            cpu: 200m
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: HOSTING_DIR
          value: /hosting
        volumeMounts:
        - name: httpd-config
          mountPath: /etc/apache2/apache2.conf
          subPath: apache2.conf
          readOnly: true
        - name: django-config
          mountPath: /app/beckcloud/settings.py
          subPath: settings.py
          readOnly: true
        - name: django-config
          mountPath: /app/beckcloud/urls.py
          subPath: urls.py
          readOnly: true
        - name: django-config
          mountPath: /app/beckcloud/wsgi.py
          subPath: wsgi.py
          readOnly: true
        - name: django-config
          mountPath: /app/beckcloud/__init__.py
          subPath: __init__.py
          readOnly: true
        - name: hosting
          mountPath: /hosting
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: httpd-config
        configMap:
          name: landing-httpd
      - name: django-config
        configMap:
          name: landing-django
          defaultMode: 420
      - name: hosting
        persistentVolumeClaim:
          claimName: silex-hosting
---
apiVersion: v1
kind: Service
metadata:
  name: landing-page
  namespace: webapps
spec:
  selector:
    app: landing-page
  ports:
  - name: http
    port: 80
    targetPort: 80
--- null
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: landing-page
  namespace: webapps
  labels:
    app: landing-page
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`becklab.cloud`)
    kind: Rule
    services:
    - name: landing-page
      port: 80
  tls:
    secretName: landing-page-tls
