# Auto-split from cluster files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: webapps
  labels:
    app: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
      - name: ghcr-credentials
      initContainers:
      - name: fix-permissions
        image: ghcr.io/yappingboy/becklab-landing:0.8.0
        command:
        - sh
        - -c
        - chmod -R a+r /hosting && chmod -R a+X /hosting
        volumeMounts:
        - name: hosting
          mountPath: /hosting
          readOnly: false
        resources:
          limits:
            memory: 32Mi
            cpu: 100m
        securityContext:
          capabilities:
            drop:
            - ALL
      containers:
      - name: landing
        image: ghcr.io/yappingboy/becklab-landing:0.8.0
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            memory: 128Mi
            cpu: 200m
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: HOSTING_DIR
          value: /hosting
        volumeMounts:
        - name: httpd-config
          mountPath: /etc/apache2/apache2.conf
          subPath: apache2.conf
          readOnly: true
        - name: django-config
          mountPath: /app/beckcloud/settings.py
          subPath: settings.py
          readOnly: true
        - name: django-config
          mountPath: /app/beckcloud/urls.py
          subPath: urls.py
          readOnly: true
        - name: django-config
          mountPath: /app/beckcloud/wsgi.py
          subPath: wsgi.py
          readOnly: true
        - name: django-config
          mountPath: /app/beckcloud/__init__.py
          subPath: __init__.py
          readOnly: true
        - name: hosting
          mountPath: /hosting
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: httpd-config
        configMap:
          name: landing-httpd
      - name: django-config
        configMap:
          name: landing-django
          defaultMode: 420
      - name: hosting
        persistentVolumeClaim:
          claimName: silex-hosting
