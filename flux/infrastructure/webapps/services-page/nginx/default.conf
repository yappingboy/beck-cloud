# BeckCloud services directory — static site + same-origin health pings.
# js/status.js fetches /ping/<key>; here nginx proxies an in-cluster request
# and answers 200 (up) or 503 (down). Same-origin means no CORS acrobatics,
# and proxying inside the cluster catches apps that are "reachable" via
# Traefik but actually erroring (Traefik 502/503 => down).
#
# NOTE: configMap mounts do not hot-reload. After editing this file or any
# static asset, run: kubectl -n webapps rollout restart deploy/services-page

resolver 10.43.0.10 valid=30s ipv6=off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/javascript image/svg+xml application/json;

server {
    listen 80;
    server_name services.becklab.cloud;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Upstream answered with anything sane => it is alive.
    location @up   { return 200 '{"status":"up"}'; }
    # Connection failed / gateway errors => down.
    location @down { return 503 '{"status":"down"}'; }

    # Each ping: exact-match location, variable proxy_pass (per-request DNS),
    # short timeouts, 3xx/4xx => up, 5xx => down, 200 passes through.
    # ---- MEDIA ----
    location = /ping/jellyfin {
        access_log off;
        set $t "http://jellyfin.media.svc.cluster.local:8096/web/index.html";
        proxy_pass $t;
        proxy_connect_timeout 3s; proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 301 302 303 307 400 401 403 404 405 429 = @up;
        error_page 500 502 503 504 = @down;
    }

    # ---- IDENTITY ----
    location = /ping/bw {
