apiVersion: apps/v1
kind: Deployment
metadata:
  name: services-page
  namespace: webapps
  labels:
    app: services-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: services-page
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: services-page
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: static-files
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
      volumes:
        - name: static-files
          configMap:
            name: services-page-static
            items:
              - key: index.html
                path: index.html
              - key: style.css
                path: style.css
              - key: services.css
                path: services.css
              - key: services.js
                path: services.js
              - key: status.js
                path: status.js
              - key: favicon.svg
                path: favicon.svg
        - name: nginx-conf
          configMap:
            name: services-page-static
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: services-page
  namespace: webapps
  labels:
    app: services-page
spec:
  selector:
    app: services-page
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: services-page
  namespace: webapps
  labels:
    app: services-page
    sso: "false"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`services.becklab.cloud`)
      kind: Rule
      priority: 5
      services:
        - name: services-page
          port: 80
          scheme: http
  tls:
    secretName: services-page-tls
