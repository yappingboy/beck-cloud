apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapps

resources:
  - services-page.yaml
  - certificate.yaml

configMapGenerator:
  - name: services-page-static
    files:
      - index.html=static/index.html
      - favicon.svg=static/favicon.svg
      - style.css=static/css/style.css
      - services.css=static/css/services.css
      - services.js=static/js/services.js
      - status.js=static/js/status.js
      - default.conf=nginx/default.conf
    options:
      disableNameSuffixHash: true
