apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - admin-panel.yaml

configMapGenerator:
  - name: admin-panel-content
    namespace: webapps
    files:
      - index.html=static/index.html
      - admin.css=static/admin.css
      - admin.js=static/admin.js
      - style.css=static/style.css
      - favicon.svg=static/favicon.svg
    behavior: replace
