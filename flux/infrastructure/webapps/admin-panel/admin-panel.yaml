---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: admin-panel
  namespace: webapps
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`admin.becklab.cloud`)
      services:
        - name: admin-panel-static
          port: 80
      middlewares:
        - name: admin-panel-compress
          namespace: webapps
        - name: sso-admin-chain
          namespace: identity
  tls:
    secretName: admin-panel-tls
---
apiVersion: v1
kind: Service
metadata:
  name: admin-panel-static
  namespace: webapps
spec:
  selector:
    app: admin-panel
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel
  namespace: webapps
  labels:
    app: admin-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-panel
  template:
    metadata:
      labels:
        app: admin-panel
    spec:
      containers:
        - name: admin-panel
          image: node:24-alpine
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 50m
          env:
            - name: PORT
              value: "8080"
          command: ["node", "/app/server.js"]
          volumeMounts:
            - name: admin-content
              mountPath: /app/static
              readOnly: true
            - name: server-code
              mountPath: /app/server.js
              subPath: server.js
              readOnly: true
      volumes:
        - name: admin-content
          configMap:
            name: admin-panel-content
        - name: server-code
          configMap:
            name: admin-panel-server-code
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-panel-content
  namespace: webapps
data:
  placeholder: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-panel-nginx-config
  namespace: webapps
data:
  default.conf: |
    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        # Proxy API calls to Node.js backend
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # /favicon.svg → /usr/share/nginx/html/favicon.svg
        location = /favicon.svg {
            root /usr/share/nginx/html;
        }

        # /css/style.css → /usr/share/nginx/html/style.css
        location /css/ {
            alias /usr/share/nginx/html/;
        }

        # /js/admin.js → /usr/share/nginx/html/admin.js
        location /js/ {
            alias /usr/share/nginx/html/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-panel-compress
  namespace: webapps
spec:
  compress: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: admin-panel
  namespace: webapps
spec:
  secretName: admin-panel-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - admin.becklab.cloud
