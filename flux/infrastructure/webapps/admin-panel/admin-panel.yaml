apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: admin-panel
  namespace: webapps
  labels:
    app: admin-panel
    sso: "false"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # API routes — bypass SSO, goes to backend
    - kind: Rule
      match: Host(`admin.becklab.cloud`) && PathPrefix(`/api/`)
      priority: 10
      services:
        - name: admin-panel-api
          port: 8080
          scheme: http
    # SPA root — SSO protected, goes to frontend
    - kind: Rule
      match: Host(`admin.becklab.cloud`) && PathPrefix(`/`)
      priority: 5
      middlewares:
        - name: sso-admin-chain
          namespace: identity
      services:
        - name: admin-panel-frontend
          port: 80
          scheme: http
  tls:
    secretName: admin-panel-tls

---
# ─── API Service ─────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: admin-panel-api
  namespace: webapps
  labels:
    app: admin-panel-api
spec:
  selector:
    app: admin-panel-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
# ─── API Deployment ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel-api
  namespace: webapps
  labels:
    app: admin-panel-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-panel-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: admin-panel-api
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      serviceAccountName: admin-panel-sa
      containers:
        - name: admin-panel-api
          image: ghcr.io/yappingboy/admin-panel:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DIRECTUS_URL
              value: "http://directus.webapps:8055"
            - name: DIRECTUS_EMAIL
              value: "admin@becklab.cloud"
            - name: DIRECTUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-panel-secrets
                  key: directus-password
            - name: KEYCLOAK_URL
              value: "http://keycloak.identity:8080"
            - name: KC_CLIENT_ID
              value: "nova-monitoring"
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-panel-secrets
                  key: kc-client-secret
            - name: KC_USERNAME
              value: "yappingboy"
            - name: KC_PASSWORD
              value: "y4pp1ngb0y"
            - name: K8S_API
              value: "https://172.16.0.20:6443"
            - name: REDIS_HOST
              value: "10.43.139.161"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "677258544"
            - name: LLDAP_URL
              value: "http://lldap.identity:17170"
            - name: LLDAP_ADMIN_USER
              value: "admin"
            - name: LLDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-panel-secrets
                  key: lldap-admin-password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

---
# ─── Secrets ─────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: admin-panel-secrets
  namespace: webapps
  labels:
    app: admin-panel
type: Opaque
stringData:
  directus-password: "suCNJ5CtDdHEdy3Zhy6azwgG"
  kc-client-secret: "9lJwF6HKD8z2l8ft9qbheIGASgAZTdrr"
  lldap-admin-password: "newpass123"

---
# ─── ServiceAccount ──────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-panel-sa
  namespace: webapps
  labels:
    app: admin-panel-api

---
# ─── ClusterRole ─────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-panel-reader
  labels:
    app: admin-panel-api
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "persistentvolumes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]

---
# ─── ClusterRoleBinding ──────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-panel-reader-binding
  labels:
    app: admin-panel-api
subjects:
  - kind: ServiceAccount
    name: admin-panel-sa
    namespace: webapps
roleRef:
  kind: ClusterRole
  name: admin-panel-reader
  apiGroup: rbac.authorization.k8s.io

---
# ─── Certificate ─────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: admin-panel
  namespace: webapps
  labels:
    app: admin-panel
spec:
  secretName: admin-panel-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - admin.becklab.cloud
