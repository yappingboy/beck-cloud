# Dashy configuration — Becklab Cloud
# Migrated from gethomepage/homepage HelmRelease (2026-08-29)
title: Becklab
favicon: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2000&q=80
theme: darkly
layout: responsive

# Background
background:
  backgroundImage: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2000&q=80
  blur: 6
  brightness: 50
  opacity: 40

# Status checking
statusUpdateInterval: 300000
statusCheck: true

# Navigation
navItems:
  - title: Dashboard
    link: /
    icon: mdi-home

# Widget bar
widgets:
  - widgetType: currentTime
    widgetProperties:
      name: Current Time
      timezone: America/Los_Angeles
      use24Hour: true
  - widgetType: cpuInfo
    widgetProperties:
      name: Cluster CPU
  - widgetType: diskInfo
    widgetProperties:
      name: Disk
  - widgetType: ramInfo
    widgetProperties:
      name: Memory
  - widgetType: searchBar
    widgetProperties:
      searchBar: true
      searchEngine: https://duckduckgo.com/?q=

