# Dashy configuration — Becklab Cloud
# Migrated from gethomepage/homepage (2026-08-29)

pageInfo:
  title: Becklab
  description: Becklab Cloud Dashboard
  favicon: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2000&q=80
  navLinks:
    - title: Grafana
      path: https://grafana.becklab.cloud
      target: newtab
    - title: Keycloak
      path: https://keycloak.becklab.cloud
      target: newtab
    - title: Traefik
      path: https://traefik.becklab.cloud
      target: newtab

appConfig:
  theme: dark
  statusCheck: true
  statusCheckInterval: 300
  statusCheckAccessibility: true
  backgroundImg: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2000&q=80
  webSearch:
    provider: duckduckgo
    searchKey: ''
    newTab: true
  hideComponents:
    - headerWidgets
  language: en

