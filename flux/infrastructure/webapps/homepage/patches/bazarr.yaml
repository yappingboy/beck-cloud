apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bazarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/description: Subtitle manager
    gethomepage.dev/group: Media
    gethomepage.dev/icon: bazarr
    gethomepage.dev/name: Bazarr
    gethomepage.dev/widget.type: bazarr
    gethomepage.dev/widget.url: https://bazarr.becklab.cloud
    gethomepage.dev/weight: '4'
    gethomepage.dev/href: https://bazarr.becklab.cloud
