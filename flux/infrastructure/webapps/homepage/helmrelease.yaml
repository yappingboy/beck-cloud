apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: webapps
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: 1.2.3
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: latest
    env:
    - name: HOMEPAGE_ALLOWED_HOSTS
      value: home.becklab.cloud
    serviceAccount:
      create: true
      name: homepage
    enableRbac: true
    ingress:
      main:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: identity-sso-media-chain@kubernetescrd
        hosts:
        - host: home.becklab.cloud
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - home.becklab.cloud
          secretName: homepage-tls
  postRenderers:
  - kustomize:
      patches:
      - target:
          version: v1
          kind: ConfigMap
          name: homepage
        patch: "apiVersion: v1\ndata:\n  bookmarks.yaml: '[]\n\n    '\n  docker.yaml:\
