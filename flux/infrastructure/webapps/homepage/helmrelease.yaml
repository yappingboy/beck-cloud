          n\\\n    \\    description: TV show manager\\n    widget:\\n      type:\
          \ sonarr\\n      url:\\\n    \\ https://sonarr.becklab.cloud\\n      key:\
          \ 50844aeb0dfe4cc68c214694c3648181\\n\\\n    \\  - Radarr:\\n    icon: si-radarr\\\
          n    href: https://radarr.becklab.cloud\\n  \\\n    \\  description: Movie\
          \ manager\\n    widget:\\n      type: radarr\\n      url: https://radarr.becklab.cloud\\\
