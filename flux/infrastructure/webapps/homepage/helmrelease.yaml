apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: webapps
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: 1.2.3
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: latest
    env:
    - name: HOMEPAGE_ALLOWED_HOSTS
      value: home.becklab.cloud
    serviceAccount:
      create: true
      name: homepage
    enableRbac: true
    config:
      bookmarks: |-
        []
      docker: |-
        {}
      kubernetes: |-
        mode: cluster
        ingress: true
        traefik: true
      services: |-
        # Homepage services with widget credentials
        # API keys are inlined below (plaintext, this is a private repo + post-renderer
        # patch). Homepage supports ${VAR_NAME} substitution if a Secret is mounted.
        #
        # NOTE: widget.url points at the INTERNAL cluster service
        # (http://<svc>.<ns>:<port>) so the server-side status probe bypasses the
        # SSO oauth2-proxy. Probing the public https://*.becklab.cloud URL returns a
        # 401 "Signing in..." redirect that Homepage reads as "not found".
        # href stays as the public URL for the click target.
        
        - Media:
          - Jellyfin:
            icon: si-jellyfin
            href: https://jellyfin.becklab.cloud
            description: Media streaming
            widget:
              type: jellyfin
              url: http://jellyfin.media:8096
              key: ""
          - Sonarr:
            icon: si-sonarr
            href: https://sonarr.becklab.cloud
            description: TV show manager
            widget:
              type: sonarr
              url: http://sonarr.media:8989
              key: 50844aeb0dfe4cc68c214694c3648181
          - Radarr:
            icon: si-radarr
            href: https://radarr.becklab.cloud
            description: Movie manager
            widget:
              type: radarr
              url: http://radarr.media:7878
              key: 657480f8c1044e359c6bffebaa372868
          - Bazarr:
            icon: bazarr
            href: https://bazarr.becklab.cloud
            description: Subtitle manager
            widget:
              type: bazarr
              url: http://bazarr.media:6767
              key: ""
          - Prowlarr:
            icon: mdi-rss
            href: https://prowlarr.becklab.cloud
            description: Indexer manager
            widget:
              type: prowlarr
              url: http://prowlarr.media:9696
              key: f4d2705198f646a08849bc68176fa880
          - SABnzbd:
            icon: mdi-download
            href: https://sabnzbd.becklab.cloud
            description: NZB downloader
            widget:
              type: sabnzbd
              url: http://sabnzbd.media:8080
              username: sabnzbd
              password: changeme1234
              key: a3239af3bd954b2d8f4fe1c35d0b2c4c
          - NZBGet:
            icon: mdi-download-circle
            href: https://nzbget.becklab.cloud
            description: NZB downloader
            widget:
              type: nzbget
              url: http://nzbget.media:6789
              username: wd7fdwngu1
              password: j@mj@u6cx2Np9te
          - qBittorrent:
            icon: si-qbittorrent
            href: https://qbit.becklab.cloud
            description: Torrent downloads
            widget:
              type: qbittorrent
              url: http://qbit-gluetun.media:8080
              username: admin
              password: ""
          - Tdarr:
            icon: mdi-filmstrip-box
            href: https://tdarr.becklab.cloud
            description: Media transcoding
            widget:
              type: tdarr
              url: http://tdarr.media:8265
              key: tsec_14df70c59a4363143361b86d267d0d136b63c622ef67abcbe278802e9147a767
          - Jellyseerr:
            icon: mdi-television-box
            href: https://requests.becklab.cloud
            description: Media requests
            widget:
              type: seerr
              url: http://jellyseerr.media:5055
              key: ""
          - Homebox:
            icon: mdi-box
            href: https://homebox.becklab.cloud
            description: Home inventory
            widget:
              type: homebox
              url: http://homebox.media:7745
              token: ""
        - Monitoring:
          - Grafana:
            icon: si-grafana
            href: https://grafana.becklab.cloud
            description: Dashboards
            widget:
              type: grafana
              url: http://kube-prometheus-stack-grafana.monitoring:80
              username: admin
              password: prom-operator
              fields:
                - cpu
                - memory
                - disk
                - net
                - temp
          - Hubble:
            icon: mdi-network
            href: https://hubble.becklab.cloud
            description: CNI observability
            excludeStatusCheck: true
        - 3D Printing:
          - Spoolman:
            icon: mdi-spool
            href: https://spoolman.becklab.cloud
            description: Filament tracker
            widget:
              type: spoolman
              url: http://spoolman.3dprinting:7912
              token: ""
        - Identity:
          - Keycloak:
            icon: keycloak.png
            href: https://keycloak.becklab.cloud
            description: SSO / Identity
            widget:
              type: keycloak
              url: http://keycloak.identity:8080
              realms:
                - homelab
        - Apps:
          - Home Assistant:
            icon: si-homeassistant
            href: https://ha.becklab.cloud
            description: Smart home
            widget:
              type: homeassistant
              url: http://home-assistant.webapps:8123
              token: welcome
        - Gaming:
          - Crafty Controller:
            icon: crafty-controller
            href: https://crafty.becklab.cloud
            description: Minecraft server
            widget:
              type: minecraft
              url: crafty-minecraft.gaming
              port: 25565
      settings: |-
        title: Becklab
        theme: dark
        color: slate
        headerStyle: clean
        background:
          image: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2000&q=80
          blur: true
          brightness: 0.5
          opacity: 0.4
        layout:
          Media:
            style: row
            columns: 4
          3D Printing:
            style: row
            columns: 4
          Apps:
            style: row
            columns: 4
          Security:
            style: row
            columns: 3
          Monitoring:
            style: row
            columns: 4
          Identity:
            style: row
            columns: 4
          Infrastructure:
            style: row
            columns: 4
          Gaming:
            style: row
            columns: 2
      widgets: |-
        resources:
          cpu: true
          memory: true
          label: Cluster
        datetime:
          text_size: xl
          format:
            timeStyle: short
            dateStyle: short
        search:
          provider: duckduckgo
          target: _blank
    ingress:
      main:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: identity-sso-media-chain@kubernetescrd
        hosts:
        - host: home.becklab.cloud
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - home.becklab.cloud
          secretName: homepage-tls
