# Auto-split from cluster files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: webapps
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        runAsGroup: 1000
        supplementalGroups:
        - 1000
      initContainers:
      - name: init-config
        image: busybox:1.37
        command:
        - sh
        - -c
        - "CONFIG=/config/configuration.yaml\nHTTP_BLOCK=\"http:\\n  use_x_forwarded_for:\
          \ true\\n  trusted_proxies:\\n    - 10.42.0.0/16\"\nif ! grep -q 'use_x_forwarded_for'\
          \ \"$CONFIG\"; then\n  echo \"\" >> \"$CONFIG\"\n  echo \"# Reverse proxy\
          \ support (Traefik + oauth2-proxy)\" >> \"$CONFIG\"\n  printf '%b\\n' \"\
          $HTTP_BLOCK\" >> \"$CONFIG\"\n  echo \"Added reverse proxy config to configuration.yaml\"\
          \nelse\n  echo \"Reverse proxy config already present, skipping\"\nfi\n"
        volumeMounts:
        - name: config
          mountPath: /config
        securityContext:
          capabilities:
            drop:
            - ALL
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        ports:
        - containerPort: 8123
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
        env:
        - name: TZ
          value: America/Los_Angeles
        - name: PYTHONUNBUFFERED
          value: '1'
        volumeMounts:
        - name: config
          mountPath: /config
        startupProbe:
          tcpSocket:
            port: 8123
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 10
        livenessProbe:
          tcpSocket:
            port: 8123
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 5
        securityContext:
          capabilities:
            drop:
            - ALL
      - name: mosquitto
        image: eclipse-mosquitto:2
        ports:
        - containerPort: 1883
        - containerPort: 9001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '0.5'
            memory: 256Mi
        volumeMounts:
        - name: mosquitto-config
          mountPath: /mosquitto/config
        - name: mosquitto-data
          mountPath: /mosquitto/data
        securityContext:
          capabilities:
            drop:
            - ALL
      - name: esphome
        image: ghcr.io/esphome/esphome:2025.2.0
        ports:
        - containerPort: 6052
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: '0.5'
            memory: 128Mi
        env:
        - name: TZ
          value: America/Los_Angeles
        securityContext:
          capabilities:
            drop:
            - ALL
      - name: matter-server
        image: ghcr.io/matter-js/python-matter-server:stable
        ports:
        - containerPort: 5580
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: '0.5'
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-config
      - name: mosquitto-config
        configMap:
          name: mosquitto-config
      - name: mosquitto-data
        emptyDir: {}
