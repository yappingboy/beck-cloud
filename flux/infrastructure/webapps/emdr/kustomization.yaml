apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapps

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - certificate.yaml

configMapGenerator:
  - name: emdr
    files:
      - index.html=static/index.html
    options:
      disableNameSuffixHash: true
