apiVersion: apps/v1
kind: Deployment
metadata:
  name: tooljet-postgres
  namespace: webapps
  labels:
    app: tooljet-postgres
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: tooljet-postgres
  template:
    metadata:
      labels:
        app: tooljet-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-100-11
      containers:
        - name: postgres
          image: postgres:16-alpine
          # tooljet_db is created idempotently below. TOOLJET_DB_NAME is a
          # fixed value: the alpine entrypoint uses first-boot env resolution
          # which cannot reference secrets, so it must stay a literal.
          command:
            - sh
            - -c
            - |
              set -e
              /usr/local/bin/docker-entrypoint.sh postgres &
              PG_PID=$!
              until pg_isready -U ${POSTGRES_USER} >/dev/null 2>&1; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -U ${POSTGRES_USER} -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname='${POSTGRES_DB}'" | grep -q 1 \
                || psql -v ON_ERROR_STOP=1 -U ${POSTGRES_USER} -d postgres \
                     -c "CREATE DATABASE \"${POSTGRES_DB}\" OWNER \"${POSTGRES_USER}\";"
              psql -v ON_ERROR_STOP=1 -U ${POSTGRES_USER} -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname='${TOOLJET_DB_NAME}'" | grep -q 1 \
                || psql -v ON_ERROR_STOP=1 -U ${POSTGRES_USER} -d postgres \
                     -c "CREATE DATABASE \"${TOOLJET_DB_NAME}\" OWNER \"${POSTGRES_USER}\";"
              wait ${PG_PID}
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tooljet-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tooljet-db
                  key: password
            # Fixed value, not a secretRef: the alpine entrypoint creates
            # this database on first boot, so it cannot reference a secret
            # (secret refs are unavailable to entrypoint env resolution).
            - name: POSTGRES_DB
              value: tooljet_production
            - name: TOOLJET_DB_NAME
              value: tooljet_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tooljet
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - tooljet
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: tooljet-postgres-data
