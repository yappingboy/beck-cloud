---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sudoku-meals
  namespace: webapps
  annotations:
    gethomepage.dev/description: Sudoku Meals — meal planning with 27 combos
    gethomepage.dev/group: Utilities
    gethomepage.dev/icon: mdi-food-apple
    gethomepage.dev/name: Sudoku Meals
    gethomepage.dev/weight: '90'
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`meals.becklab.cloud`)
      kind: Rule
      services:
        - name: sudoku-meals
          port: 8080
          scheme: http
  tls:
    secretName: sudoku-meals-tls
