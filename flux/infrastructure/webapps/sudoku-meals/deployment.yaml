apiVersion: apps/v1
kind: Deployment
metadata:
  name: sudoku-meals
  namespace: webapps
  labels:
    app: sudoku-meals
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sudoku-meals
  template:
    metadata:
      labels:
        app: sudoku-meals
    spec:
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: html
        configMap:
          name: sudoku-meals-html
---
