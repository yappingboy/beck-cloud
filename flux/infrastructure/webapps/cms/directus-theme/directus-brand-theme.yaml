apiVersion: v1
data:
  index.js: |-
    export default {
      id: 'beckcloud-brand',
      name: 'BeckCloud Brand',
      appearance: 'dark',
      theme: {
        colors: {
          primary: {
            50: '#FFF8E1',
            100: '#FFECB3',
            200: '#FFE082',
            300: '#FFD54F',
            400: '#FFCA28',
            500: '#E8A838',
            600: '#D4922A',
            700: '#A67220',
            800: '#785216',
            900: '#4A320C',
          },
          accent: {
            500: '#FF6B4A',
          },
          foreground: '#E2E8F0',
          foregroundSubdued: '#94A3B8',
          foregroundAlternation: '#E8A838',
          foregroundWarning: '#FBBF24',
          foregroundError: '#EF4444',
          foregroundSuccess: '#4ADE80',
          background: '#0F1729',
          backgroundSubdued: '#1E293B',
          border: '#334155',
        },
        fonts: {
          fontFamily: 'Inter, sans-serif',
          codeFontFamily: 'JetBrains Mono, monospace',
        },
        rules: {
          borderRadius: '8px',
          borderWidth: '1px',
          shadow: '0 2px 8px rgba(0,0,0,0.3)',
        },
      },
    };
  package.json: |
    {
      "name": "beckcloud-brand",
      "version": "1.0.0",
      "description": "BeckCloud brand theme for Directus",
      "keywords": ["directus-extension"],
      "main": "index.js",
      "directus:extension": {
        "type": "theme",
        "path": "index.js",
        "source": "javascript"
      }
    }
  brand.css: |
    /* BeckCloud Brand Theme for Directus Admin */
    :root, body, .app, .v-application {
      background-color: #0F1729 !important;
      color: #E2E8F0 !important;
    }
    .v-application__wrap { background-color: #0F1729 !important; }
    [class*="app-header"], [class*="header-bar"], .v-app-bar, [class*="top-bar"] {
      background-color: #1E293B !important; border-bottom: 1px solid #334155 !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3) !important;
    }
    [class*="app-header"] [class*="title"], [class*="app-logo"] {
      color: #E8A838 !important; font-family: 'JetBrains Mono', monospace !important;
      font-weight: 700 !important; letter-spacing: -0.5px !important;
    }
    [class*="sidebar"], [class*="nav-drawer"], .v-navigation-drawer {
      background-color: #1E293B !important; border-right: 1px solid #334155 !important;
    }
    [class*="sidebar"] [class*="item"], [class*="nav-item"], .v-list-item {
      color: #94A3B8 !important; transition: background-color 0.2s ease, color 0.2s ease !important;
    }
    [class*="sidebar"] [class*="item"]:hover, [class*="nav-item"]:hover, .v-list-item:hover {
      background-color: #283548 !important; color: #E2E8F0 !important;
    }
    [class*="sidebar"] [class*="item"][class*="active"], [class*="nav-item"][class*="active"], .v-list-item--active {
      color: #E8A838 !important; background-color: rgba(232,168,56,0.08) !important; border-left: 3px solid #E8A838 !important;
    }
    [class*="card"], [class*="panel"], .v-card, [class*="collection-item"] {
      background-color: #1E293B !important; border: 1px solid #334155 !important;
      border-radius: 8px !important; box-shadow: 0 2px 8px rgba(0,0,0,0.2) !important;
    }
    [class*="btn"], button[class*="btn"], .v-btn {
      background: linear-gradient(90deg, #E8A838 0%, #FF6B4A 100%) !important;
      color: #0F1729 !important; border: none !important; border-radius: 6px !important;
      font-weight: 600 !important; font-family: 'Inter', sans-serif !important;
      transition: transform 0.15s ease, box-shadow 0.2s ease !important;
    }
    [class*="btn"]:hover, button[class*="btn"]:hover, .v-btn:hover {
      transform: translateY(-1px) !important; box-shadow: 0 4px 16px rgba(232,168,56,0.3) !important;
    }
    [class*="primary"], [class*="action"], [class*="save"] {
      background: linear-gradient(90deg, #E8A838 0%, #FF6B4A 100%) !important; color: #0F1729 !important;
    }
    input[type="text"], input[type="search"], input[type="password"], [class*="input"], .v-text-field, .v-input {
      background-color: #0F1729 !important; border: 1px solid #334155 !important;
      color: #E2E8F0 !important; border-radius: 6px !important;
    }
    input[type="text"]:focus, [class*="input"]:focus, .v-text-field--focused {
      border-color: #E8A838 !important; box-shadow: 0 0 0 2px rgba(232,168,56,0.15) !important; outline: none !important;
    }
    table, [class*="table"], .v-data-table { background-color: transparent !important; color: #E2E8F0 !important; }
    [class*="table"] th, [class*="table-header"], .v-data-table th {
      color: #E8A838 !important; font-family: 'JetBrains Mono', monospace !important;
      font-size: 0.75rem !important; text-transform: uppercase !important;
      letter-spacing: 0.06em !important; border-bottom: 2px solid #334155 !important;
    }
    [class*="table"] tr:nth-child(even), [class*="table"] tbody tr:nth-child(even) {
      background-color: rgba(30,41,59,0.5) !important;
    }
    [class*="table"] tr:hover, [class*="table"] tbody tr:hover {
      background-color: rgba(232,168,56,0.04) !important;
    }
    [class*="modal"], [class*="dialog"], [class*="overlay"], .v-dialog, .v-overlay {
      background-color: #1E293B !important; border: 1px solid #334155 !important;
      border-radius: 10px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1E293B; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    [class*="success"], [class*="ok"] { color: #4ADE80 !important; }
    [class*="warning"] { color: #FBBF24 !important; }
    [class*="error"], [class*="critical"] { color: #EF4444 !important; }
    [class*="spinner"], [class*="loading"] { color: #E8A838 !important; }
    [class*="tag"], [class*="chip"], .v-chip {
      background-color: rgba(232,168,56,0.15) !important; color: #E8A838 !important;
      border: 1px solid rgba(232,168,56,0.3) !important; border-radius: 4px !important;
    }
    [class*="empty"], [class*="placeholder"], [class*="no-data"] { color: #64748B !important; font-style: italic !important; }
    [class*="label"], .v-label { color: #E2E8F0 !important; font-weight: 500 !important; }
    [class*="helper"], [class*="caption"] { color: #94A3B8 !important; font-size: 0.8125rem !important; }
    [class*="search-bar"], [class*="search-input"] {
      background-color: #0F1729 !important; border: 1px solid #334155 !important;
      color: #E2E8F0 !important; border-radius: 6px !important;
    }
    [class*="search-bar"]:focus-within, [class*="search-input"]:focus {
      border-color: #E8A838 !important; box-shadow: 0 0 0 2px rgba(232,168,56,0.15) !important;
    }
kind: ConfigMap
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/component: directus-brand
    kustomize.toolkit.fluxcd.io/name: infrastructure
  name: directus-brand-theme
  namespace: webapps
