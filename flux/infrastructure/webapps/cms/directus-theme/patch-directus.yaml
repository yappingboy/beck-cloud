apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: webapps
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: directus
        env:
        - name: DIRECTUS_BRAND_COLOR
          value: '#E8A838'
        - name: DIRECTUS_BRAND_NAME
          value: BeckCloud
        - name: DIRECTUS_BRAND_LOGO
          value: https://becklab.cloud/logo.svg
        volumeMounts:
        - name: brand-theme
          mountPath: /directus/public/brand.css
          subPath: brand.css
          readOnly: true
        - name: brand-theme
          mountPath: /directus/extensions/beckcloud-brand/host.html
          subPath: host.html
          readOnly: true
        securityContext:
          capabilities:
            drop:
            - ALL
      volumes:
      - name: brand-theme
        configMap:
          name: directus-brand-theme
          items:
          - key: brand.css
            path: brand.css
          - key: package.json
            path: package.json
          - key: index.js
            path: index.js
          - key: host.html
            path: host.html
