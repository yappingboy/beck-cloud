apiVersion: batch/v1
kind: Job
metadata:
  name: cadam-debug
  namespace: toolbox
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: build
          image: node:22-slim
          command:
            - sh
            - -c
            - |
              set -e
              cd /app
              echo "== finding .output tree =="
              find .output -maxdepth 3 -type f 2>/dev/null | head -60
              echo "== public top =="
              ls -la .output/public 2>/dev/null | head
              echo "== index.html candidates =="
              find .output -name 'index.html' 2>/dev/null
              echo "== server =="
              ls -la .output/server 2>/dev/null | head
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: ws
              mountPath: /app
      volumes:
        - name: ws
          emptyDir: {}
