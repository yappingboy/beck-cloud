# CADAM on BeckCloud
# Served under the /cadam base path (Vite base + TanStack router basepath).
# SPA fallback routes unknown paths under /cadam back to index.html.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite build emits sourcemaps + large wasm chunks
    client_max_body_size 256m;

    # Gzip for the big vendor chunks
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_size 1024;

    # Long cache for hashed assets
    location /cadam/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # OpenSCAD wasm — do not cache aggressively (build may rotate it)
    location /cadam/src/vendor/openscad-wasm/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback
    location /cadam/ {
        try_files $uri $uri/ /cadam/index.html;
    }

    location = / {
        return 302 /cadam/;
    }

    access_log /var/log/nginx/cadam.access.log;
    error_log  /var/log/nginx/cadam.error.log;
}
