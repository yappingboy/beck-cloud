# Build and push all container images to GHCR.
# Triggered on push to main branch when apps/ or tools/ change.
# Replaces the in-cluster Kaniko job approach.

name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: yappingboy

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- apps ----
          - name: user-invite
            path: apps/user-invite
            image: becklab-user-invite
            context: apps/user-invite
          - name: gridspace
            path: apps/gridspace
            image: becklab-gridspace
            context: apps/gridspace
          - name: landing-page
            path: apps/landing-page
            image: becklab-landing
            context: apps/landing-page

          # ---- tools (Go binaries) ----
          - name: hash
            path: tools/hash
            image: hash
            context: tools/hash
          - name: converter
            path: tools/base64
            image: converter
            context: tools/base64
          - name: url-shortener
            path: tools/url-shortener
            image: url-shortener
            context: tools/url-shortener
          - name: qr-generator
            path: tools/qr-generator
            image: qr-generator
            context: tools/qr-generator
          - name: yaml-json-tool
            path: tools/yaml-json-tool
            image: yaml-json-tool
            context: tools/yaml-json-tool
          - name: webhook-relay
            path: tools/webhook-relay
            image: webhook-relay
            context: tools/webhook-relay
          - name: cron-jobs
            path: tools/cron-jobs
            image: cron-jobs
            context: tools/cron-jobs
          - name: dns-monitor
            path: tools/dns-monitor
            image: dns-monitor
            context: tools/dns-monitor
          - name: auth-micro
            path: tools/auth-service
            image: auth-micro
            context: tools/auth-service

          # ---- tools (multi-stage / frontend) ----
          - name: image-editor-api
            path: tools/image-editor
            image: image-editor-api
            context: tools/image-editor
            dockerfile: tools/image-editor/api/Dockerfile
          - name: image-editor-frontend
            path: tools/image-editor
            image: image-editor-frontend
            context: tools/image-editor
            dockerfile: tools/image-editor/frontend/Dockerfile
          - name: beckflow
            path: tools/beckflow
            image: beckflow
            context: tools/beckflow
            dockerfile: tools/beckflow/api/Dockerfile
          - name: beckflow-frontend
            path: tools/beckflow
            image: beckflow-frontend
            context: tools/beckflow
            dockerfile: tools/beckflow/frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
