# Build and push all container images to GHCR.
# Triggered on push to main branch when apps/ or tools/ change.
# Replaces the in-cluster Kaniko job approach.

name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'apps-source/**'
      - 'tools/**'
      - 'flux/infrastructure/webapps/emdr/static/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: yappingboy

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- apps ----
          - name: user-invite
            path: apps-source/apps/user-invite
            image: becklab-user-invite
            context: apps-source/apps/user-invite
          - name: gridspace
            path: apps-source/apps/gridspace
            image: becklab-gridspace
            context: apps-source/apps/gridspace
            grid-apps: true
          - name: landing-page
            path: apps-source/apps/landing-page
            image: becklab-landing
            context: apps-source/apps/landing-page
          - name: admin-panel
            path: apps-source/admin-panel
            image: admin-panel
            context: apps-source/admin-panel

          # ---- tools (Go binaries) ----
          - name: hash
            path: apps-source/tools/hash
            image: hash
            context: apps-source/tools/hash
          - name: converter
            path: apps-source/tools/base64
            image: converter
            context: apps-source/tools/base64
          - name: url-shortener
            path: apps-source/tools/url-shortener
            image: url-shortener
            context: apps-source/tools/url-shortener
          - name: qr-generator
            path: apps-source/tools/qr-generator
            image: qr-generator
            context: apps-source/tools/qr-generator
          - name: yaml-json-tool
            path: apps-source/tools/yaml-json-tool
            image: yaml-json-tool
            context: apps-source/tools/yaml-json-tool
          - name: webhook-relay
            path: apps-source/tools/webhook-relay
            image: webhook-relay
            context: apps-source/tools/webhook-relay
          - name: cron-jobs
            path: apps-source/tools/cron-jobs
            image: cron-jobs
            context: apps-source/tools/cron-jobs
          - name: dns-monitor
            path: apps-source/tools/dns-monitor
            image: dns-monitor
            context: apps-source/tools/dns-monitor
          - name: auth-micro
            path: apps-source/tools/auth-service
            image: auth-micro
            context: apps-source/tools/auth-service

          - name: role-enforcer
            path: apps-source/role-enforcer
            image: role-enforcer
            context: apps-source/role-enforcer

          # ---- tools (multi-stage / frontend) ----
          - name: image-editor-api
            path: apps-source/tools/image-editor
            image: image-editor-api
            context: apps-source/tools/image-editor/api
          - name: image-editor-frontend
            path: apps-source/tools/image-editor
            image: image-editor-frontend
            context: apps-source/tools/image-editor/frontend
          - name: beckflow
            path: apps-source/tools/beckflow
            image: beckflow
            context: apps-source/tools/beckflow/api
          - name: beckflow-frontend
            path: apps-source/tools/beckflow
            image: beckflow-frontend
            context: apps-source/tools/beckflow/frontend
          - name: tools-hub
            path: apps-source/tools/tools-hub
            image: tools-hub
            context: apps-source/tools/tools-hub

          # ---- static web apps ----
          - name: emdr
            path: flux/infrastructure/webapps/emdr/static
            image: emdr
            context: flux/infrastructure/webapps/emdr/static

          - name: build-dashboard
            path: apps/tools/build-dashboard
            image: build-dashboard
            context: apps/tools/build-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone GridSpace external repo
        if: matrix.grid-apps
        run: |
          git clone --depth 1 https://github.com/GridSpace/grid-apps.git /tmp/grid-apps
          cp -r /tmp/grid-apps/package.json /tmp/grid-apps/app.js /tmp/grid-apps/apps /tmp/grid-apps/src /tmp/grid-apps/web /tmp/grid-apps/bin apps-source/apps/gridspace/
          mkdir -p apps-source/apps/gridspace/src/cli
          echo '{"appId": "gridspace", "appName": "GridSpace"}' > apps-source/apps/gridspace/src/cli/tina2s.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
